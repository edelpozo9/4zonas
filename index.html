      addLog(g,'ataque','*'+nombre+'* ataca una oculta de *'+nameOf(g,entry.card.owner)+'* en *'+ZONE_LABEL[zoneKey]+'*: era un *'+cardLabel(entry.card.value)+'* y se descarta.');
      entry.faceUp = true;
      entry.discarded = true;
      entry.discardedBy = nombre;
      entry.revealedBy = nombre;
    }
  } else {
    if(!entry.attackedOnce){
      entry.attackedOnce=true;
      entry.attackedBy = (entry.attackedBy||[]).concat([nombre]);
      addLog(g,'ataque','*'+nombre+'* marca el *'+cardLabel(entry.card.value)+'* de *'+nameOf(g,entry.card.owner)+'* en *'+ZONE_LABEL[zoneKey]+'*: un ataque más y cae.');
    } else {
      entry.attackedBy = (entry.attackedBy||[]).concat([nombre]);
      addLog(g,'ataque','*'+nombre+'* derriba el *'+cardLabel(entry.card.value)+'* de *'+nameOf(g,entry.card.owner)+'* en *'+ZONE_LABEL[zoneKey]+'* con el segundo ataque.');
      entry.discarded = true;
      entry.discardedBy = nombre;
    }
  }
}

async function attackTarget(zoneKey, entry){
  const g = game;
  if(g.phase!=='atacar') return;
  const attacker = currentAttacker(g);
  if(attacker!==myId) return;
  if(entry.card.owner===myId) return;
  if(g.tokens[myId]<1){ errorMsg='No te quedan Ataques.'; render(); return; }
  const zone = g.zones[zoneKey];
  if(!zone.includes(entry) || entry.discarded){ render(); return; }
  applyAttack(g, myId, zoneKey, entry);
  await writeGame(g);
}
function applyPass(g, playerId, forzado){
  g.attackPassed[playerId]=true;
  g.turnAttacks = 0;
  addLog(g,'ataque', forzado
    ? '*'+nameOf(g,playerId)+'* pasa automáticamente: llevaba demasiado tiempo sin responder.'
    : '*'+nameOf(g,playerId)+'* pasa sin atacar.');
  const order=g.turnOrder;
  const allPassed = order.every(id=>g.attackPassed[id]);
  if(allPassed){
    g.phase='resolver';
    g.resolveStep=0;
    g.roundResults=[];
    prepareUmbralChoicesIfNeeded(g);
    addLog(g,'ronda','*Resolución de zonas.*');
  } else {
    let tries=0;
    do{
      g.attackTurnIndex=(g.attackTurnIndex+1)%order.length;
      tries++;
    } while(g.attackPassed[order[g.attackTurnIndex]] && tries<=order.length);
  }
}

/* ================= PARTIDA BLOQUEADA / RELEVO DE ANFITRIÓN =================
   El anfitrión era un punto único de fallo: si cerraba la pestaña, nadie podía
   resolver zonas ni pasar de ronda. Detectamos el bloqueo con updatedAt (que ya
   se escribe en cada acción, así que no añade tráfico) y dejamos que cualquiera
   tome el relevo. Es seguro porque resolver y avanzar de ronda son operaciones
   deterministas: dos jugadores que las ejecuten sobre el mismo estado producen
   exactamente el mismo resultado. */
const STALL_SECONDS = 45;
const GRACE_SECONDS = 300;  // cortesía antes de poder cerrar la partida sin quien falta

function secondsStalled(g){
  if(!g || !g.updatedAt) return 0;
  return Math.max(0, Math.floor((Date.now() - g.updatedAt)/1000));
}

/* Quién está bloqueando la partida ahora mismo, y qué se espera de él. */
function waitingOn(g){
  if(!g) return null;
  if(g.status==='lobby') return {id:g.hostId, que:'empezar la partida', esAnfitrion:true};
  if(g.status!=='playing') return null;
  if(g.phase==='jugar'){
    if(g.pendingSwap) return {id: g.pendingSwap.by, que:'terminar el intercambio de su J', esAnfitrion:false, puedeSaltarse:true};
    return {id: currentPlayTurnPlayer(g), que:'jugar una carta', esAnfitrion:false};
  }
  if(g.phase==='atacar') return {id: currentAttacker(g), que:'atacar o pasar', esAnfitrion:false, puedePasarse:true};
  if(g.phase==='resolver'){
    if(umbralChoicesPending(g)){
      const cid = Object.keys(g.pendingUmbralChoices).find(c=>g.pendingUmbralChoices[c]===null);
      const e = cid && g.zones.umbral.find(x=>x.card.id===cid);
      if(e) return {id:e.card.owner, que:'elegir su modificador de Umbral', esAnfitrion:false};
    }
    return {id:g.hostId, que:'resolver la zona', esAnfitrion:true};
  }
  if(g.phase==='mantenimiento'){
    if(maintenancePending(g)){
      const pid = g.players.map(p=>p.id).find(id=>g.pendingMaintenance && g.pendingMaintenance[id]===false);
      if(pid) return {id:pid, que:'colocar su carta sobrante', esAnfitrion:false};
    }
    return {id:g.hostId, que:(g.round>=4?'terminar la partida':'empezar la ronda siguiente'), esAnfitrion:true};
  }
  return null;
}

/* Tomar el papel de anfitrión cuando el actual no responde. */
async function claimHost(){
  const g = await readGame(roomCodeVal);
  if(!g){ errorMsg='No se pudo leer la sala.'; render(); return; }
  if(g.hostId===myId) return;
  if(secondsStalled(g) < STALL_SECONDS){ errorMsg='La partida ha vuelto a moverse: ya no hace falta el relevo.'; render(); return; }
  const anterior = nameOf(g, g.hostId);
  g.hostId = myId;
  addLog(g,'sala','*'+myName+'* toma el control: *'+anterior+'* llevaba demasiado tiempo sin responder.');
  await writeGame(g);
}

/* Cierra la partida antes de tiempo cuando alguien no vuelve. Se conserva el
   marcador tal y como está y se declara el ganador provisional. */
async function endEarly(){
  const g = await readGame(roomCodeVal);
  if(!g || g.status!=='playing') return;
  if(secondsStalled(g) < GRACE_SECONDS){ errorMsg='Todavía queda tiempo de cortesía.'; render(); return; }
  g.status='ended';
  g.endedEarly=true;
  g.winner = computeFinalWinner(g);
  addLog(g,'fin','Partida terminada antes de tiempo: alguien no ha vuelto. '+
    (g.winner ? 'Gana *'+nameOf(g,g.winner)+'* con el marcador actual.' : 'Nadie va en cabeza: sin ganador.'));
  await writeGame(g);
}

async function passAttack(){
  const g = game;
  if(g.phase!=='atacar') return;
  if(currentAttacker(g)!==myId) return;
  ui.pendingAttack = null;
  applyPass(g, myId, false);
  await writeGame(g);
}

/* Pasar el turno de alguien que lleva demasiado tiempo sin responder.
   Es seguro: pasar es una jugada legal que no altera el tablero, y si dos
   jugadores lo hacen a la vez ambos calculan el mismo estado resultante. */
async function passAttackFor(playerId){
  const g = await readGame(roomCodeVal);
  if(!g || g.phase!=='atacar') return;
  if(currentAttacker(g)!==playerId || g.attackPassed[playerId]) return;
  if(secondsStalled(g) < STALL_SECONDS){ errorMsg='La partida ha vuelto a moverse.'; render(); return; }
  applyPass(g, playerId, true);
  await writeGame(g);
}

/* ============================= RESOLVER PHASE ============================= */
function prepareUmbralChoicesIfNeeded(g){
  g.pendingUmbralChoices=null;
  const currentZone = ZONE_ORDER[g.resolveStep];
  if(currentZone==='umbral'){
    const need = g.zones.umbral.filter(e=>!e.revealed);
    if(need.length>0){
      g.pendingUmbralChoices = {};
      need.forEach(e=> g.pendingUmbralChoices[e.card.id]=null);
    }
  }
}
function umbralChoicesPending(g){
  if(!g.pendingUmbralChoices) return false;
  return Object.values(g.pendingUmbralChoices).some(v=>v===null);
}
async function submitUmbralChoice(cardId, choice){
  const g = game;
  g.pendingUmbralChoices[cardId]=choice;
  const entry = g.zones.umbral.find(e=>e.card.id===cardId);
  if(entry){ entry.revealed=true; entry.umbralChoice=choice; }
  addLog(g,'umbral','*'+myName+'* fija un modificador en *Umbral*.');
  await writeGame(g);
}

function finalValue(zoneKey, entry){
  const base = baseValue(entry.card.value);
  if(!entry.originalFaceDown) return base;
  if(zoneKey==='bisagra') return base;
  if(zoneKey==='umbral') return base + (entry.umbralChoice||0);
  if(zoneKey==='cima') return base+2;
  if(zoneKey==='foso') return base-2;
  return base;
}

/* Devuelve {winner, viaAdvantage}.
   - Si las cartas empatadas en cabeza son todas del MISMO jugador, es un empate
     consigo mismo: sus cartas se anulan y queda fuera de la zona. La ventaja de
     Bisagra NO lo rescata, porque no hay carta más alta ni más baja que valga.
   - Si el empate es entre jugadores distintos, sí lo rompe la ventaja de Bisagra. */
function resolveMaxMinCascade(cards, mode, bisagraAdvantage){
  let remaining = cards.slice();
  while(remaining.length>0){
    const vals = remaining.map(c=>c.value);
    const target = mode==='max' ? Math.max(...vals) : Math.min(...vals);
    const atTarget = remaining.filter(c=>c.value===target);
    const owners = [...new Set(atTarget.map(c=>c.owner))];
    if(owners.length===1){
      if(atTarget.length===1) return {winner: owners[0], viaAdvantage:false};
      remaining = remaining.filter(c=>c.owner!==owners[0]);
      continue;
    }
    if(bisagraAdvantage && owners.includes(bisagraAdvantage)){
      return {winner: bisagraAdvantage, viaAdvantage:true};
    }
    remaining = remaining.filter(c=>!owners.includes(c.owner));
  }
  return {winner:null, viaAdvantage:false};
}

async function resolveCurrentZone(){
  const g = game;
  if(g.hostId!==myId) return;
  if(g.phase!=='resolver') return;
  if(umbralChoicesPending(g)) return;
  const zoneKey = ZONE_ORDER[g.resolveStep];
  const todasVivas = liveCards(g, zoneKey);
  g.roundResults = g.roundResults || [];

  // Las cartas se revelan al resolver la zona y se quedan visibles en la mesa
  // hasta que se hayan resuelto las cuatro zonas.
  todasVivas.forEach(e=>{ e.revealed=true; e.faceUp=true; });
  g.resolvedZones = g.resolvedZones || {};
  g.resolvedZones[zoneKey] = true;

  const flags = (g.zoneFlags && g.zoneFlags[zoneKey]) || {};
  const caidas = g.zones[zoneKey].filter(e=>e.discarded).length;
  /* Frase para cuando la zona se resuelve sin ninguna carta en pie. */
  const sinCartas = caidas>0
    ? ('Las '+(caidas===1?'única carta que se jugó aquí cayó':caidas+' cartas que se jugaron aquí cayeron')+' antes de la resolución. La zona queda desierta.')
    : null;

  let winner=null;
  let reasonText='';
  let viaAdvantage=false;
  let excluidos=[];
  let prefacio='';
  // El efecto de la K y del As se registra a nivel de ZONA cuando se activan, así que
  // siguen aplicando aunque la carta se descarte después con ataques o la mueva una J.
  let entries = todasVivas;
  if(flags.eclipse){
    reasonText = 'Un As al descubierto ha dejado el estrato en entredicho. La zona no se adjudica.';
  } else {
    const coronationOwners = [...new Set(flags.coronation || [])];
    let coronaResuelta = false;
    if(coronationOwners.length>0){
      if(coronationOwners.length===1){
        winner = coronationOwners[0];
        coronaResuelta = true;
        reasonText = 'La K de '+nameOf(g,winner)+' quedó al descubierto: un nombre que nadie discute se lleva la zona.';
      } else if(g.bisagraAdvantage && coronationOwners.includes(g.bisagraAdvantage)){
        winner = g.bisagraAdvantage; viaAdvantage = true; coronaResuelta = true;
        reasonText = 'Varias K al descubierto, pero '+nameOf(g,winner)+' controla la Bisagra y se lleva la zona.';
      } else {
        // Se anulan entre sí: quedan fuera y la zona se resuelve entre los demás.
        excluidos = coronationOwners.slice();
        prefacio = 'Las K de '+listar(coronationOwners.map(id=>nameOf(g,id)))+' se anulan entre sí y quedan fuera del reparto. ';
      }
    }
    if(excluidos.length) entries = todasVivas.filter(e=>excluidos.indexOf(e.card.owner)<0);
    if(coronaResuelta){
      /* ya decidida */
    } else if(zoneKey==='bisagra'){
      if(entries.length===0){
        reasonText = sinCartas || 'No se jugó ninguna carta en la Bisagra.';
      } else if(entries.length===1){
        winner = entries[0].card.owner;
        reasonText = 'Única carta en juego: se lleva la Bisagra sin oposición.';
      } else if(entries.length===2){
        const [c1,c2] = entries;
        const v1=finalValue('bisagra',c1), v2=finalValue('bisagra',c2);
        if(v1===v2){
          reasonText = c1.card.owner===c2.card.owner
            ? 'Dos cartas de la misma casa con idéntico valor ('+v1+'): sin carta alta ni baja, la Bisagra queda desierta.'
            : 'Ambas cartas valen '+v1+'. Empate sin desempate posible: la Bisagra queda desierta.';
        } else if(c1.card.owner===c2.card.owner){
          const par = (v1+v2)%2===0;
          winner = c1.card.owner;
          reasonText = 'Ambas cartas son de la misma casa (suma '+(v1+v2)+', '+(par?'par':'impar')+'), que se lleva la Bisagra sin disputa.';
        } else {
          const sum=v1+v2;
          const par = sum%2===0;
          winner = par ? (v1>v2?c1:c2).card.owner : (v1<v2?c1:c2).card.owner;
          reasonText = 'Suma '+sum+', '+(par?'par':'impar')+': la Bisagra se inclina hacia la carta '+(par?'más alta, el '+Math.max(v1,v2):'más baja, el '+Math.min(v1,v2))+'.';
        }
      } else {
        reasonText = 'La Bisagra no admite más de dos cartas. Queda desierta.';
      }
    } else if(zoneKey==='umbral'){
      if(entries.length===0){
        reasonText = sinCartas || 'No se jugó ninguna carta en el Umbral.';
      } else {
        const sums={};
        entries.forEach(e=>{ sums[e.card.owner]=(sums[e.card.owner]||0)+finalValue('umbral',e); });
        const detalle = g.players.filter(p=>sums[p.id]!==undefined)
          .map(p=>nameOf(g,p.id)+' '+sums[p.id]+(sums[p.id]>11?' (se pasa)':''))
          .join(' · ');
        let candidates = Object.entries(sums).filter(([id,s])=>s<=11).map(([id,s])=>({owner:id,value:s}));
        if(candidates.length===0){
          reasonText = detalle+'. Todas las casas se exceden de 11: nadie cruza el Umbral.';
        } else {
          const r = resolveMaxMinCascade(candidates,'max', g.bisagraAdvantage);
          winner = r.winner; viaAdvantage = r.viaAdvantage;
          reasonText = detalle+'. '+(winner ? sums[winner]+' es la medida más ajustada a 11 sin excederse.' : 'Empate irresoluble: el Umbral queda desierto.');
        }
      }
    } else if(zoneKey==='cima'){
      if(entries.length===0){
        reasonText = sinCartas || 'No se jugó ninguna carta en la Cima.';
      } else {
        const cards = entries.map(e=>({owner:e.card.owner, value:finalValue('cima',e)}));
        const r = resolveMaxMinCascade(cards,'max', g.bisagraAdvantage);
        winner = r.winner; viaAdvantage = r.viaAdvantage;
        reasonText = winner ? 'Suya es la carta más alta de la Cima.' : 'Los empates se anulan y nadie queda por encima del resto: la Cima no reconoce a nadie.';
      }
    } else if(zoneKey==='foso'){
      if(entries.length===0){
        reasonText = sinCartas || 'No se jugó ninguna carta en el Foso.';
      } else {
        const cards = entries.map(e=>({owner:e.card.owner, value:finalValue('foso',e)}));
        const r = resolveMaxMinCascade(cards,'min', g.bisagraAdvantage);
        winner = r.winner; viaAdvantage = r.viaAdvantage;
        reasonText = winner ? 'Suya es la carta más discreta del Foso.' : 'Los empates se anulan y nadie queda por debajo del resto: el Foso no reconoce a nadie.';
      }
    }
  }
  if(prefacio) reasonText = prefacio + reasonText;
  addLog(g,'zona','*'+ZONE_LABEL[zoneKey]+'*: '+reasonText);

  let gainsText = '';
  if(winner){
    const reward = ZONE_REWARD[zoneKey];
    g.prestige[winner] = (g.prestige[winner]||0) + reward.prestige;
    const gains = ['+'+reward.prestige+' Prestigio'];
    if(reward.token>0){
      g.tokens[winner] = (g.tokens[winner]||0) + reward.token;
      gains.push('+'+reward.token+' Ataque');
    }
    if(zoneKey==='bisagra'){
      g.bisagraAdvantage=winner;
      gains.push('⚖ ventaja');
    }
    gainsText = gains.join(' · ');
  }
  g.roundResults.push({
    zone: zoneKey,
    winner: winner || null,
    gains: gainsText,
    reason: reasonText,
    advantage: !!viaAdvantage,
    text: (winner ? nameOf(g,winner)+' gana '+ZONE_LABEL[zoneKey]+' — '+gainsText+'. ' : 'Nadie gana '+ZONE_LABEL[zoneKey]+'. ')+reasonText
  });

  g.resolveStep+=1;
  if(g.resolveStep>=ZONE_ORDER.length){
    // Las cartas se quedan en la mesa durante el mantenimiento para poder comentar
    // los resultados; se retiran al pulsar "Siguiente ronda" / "Terminar partida".
    g.phase='mantenimiento';
    preparePendingMaintenance(g);
    addLog(g,'ronda','Resueltas las cuatro zonas de la ronda '+g.round+'.');
  } else {
    prepareUmbralChoicesIfNeeded(g);
  }
  await writeGame(g);
}

function clearTable(g){
  ZONE_KEYS.forEach(zk=>{
    g.zones[zk].forEach(e=> g.discard[e.card.owner].push(e.card));
    g.zones[zk]=[];
  });
}

/* ============================= MANTENIMIENTO ============================= */
function preparePendingMaintenance(g){
  g.pendingMaintenance=null;
  if(g.round>=4) return;
  const need = g.players.filter(p=> (g.hands[p.id]||[]).length>0);
  if(need.length>0){
    g.pendingMaintenance={};
    need.forEach(p=> g.pendingMaintenance[p.id]=false);
  }
}
function maintenancePending(g){
  if(!g.pendingMaintenance) return false;
  return Object.values(g.pendingMaintenance).some(v=>v===false);
}
async function submitMaintenanceChoice(top){
  const g = game;
  if(!g.pendingMaintenance || g.pendingMaintenance[myId]!==false) return; // ya resuelto
  const hand = g.hands[myId] || [];
  const card = hand.pop();
  if(!card){ g.pendingMaintenance[myId]=true; await writeGame(g); return; }
  if(top) g.decks[myId].unshift(card); else g.decks[myId].push(card);
  g.pendingMaintenance[myId]=true;
  addLog(g,'jugar','*'+myName+'* coloca su carta sobrante '+(top?'encima':'debajo')+' del mazo.');
  await writeGame(g);
}

async function nextRoundOrEnd(){
  const g = game;
  if(g.hostId!==myId) return;
  if(g.phase!=='mantenimiento') return;
  if(maintenancePending(g)) return;
  // los Ataques gastados no se recuperan (salvo el que da ganar Bisagra, ya aplicado)
  g.players.forEach(p=>{ g.spentThisRound[p.id]=0; });
  clearTable(g);
  if(g.round>=4){
    g.status='ended';
    g.winner = computeFinalWinner(g);
    const out = finalOutcome(g);
    out.anulados.forEach(a=>{
      addLog(g,'fin','Empate a *'+a.tope+'* de Prestigio entre *'+listar(a.ids.map(id=>nameOf(g,id)))
        +'*: se anulan entre sí y quedan fuera del reparto.');
    });
    if(!g.winner){
      addLog(g,'fin','Fin de la partida: todas las casas quedaron anuladas, *nadie gana*.');
    } else if(out.porBisagra){
      const otros = out.empatados.filter(id=>id!==g.winner).map(id=>nameOf(g,id));
      addLog(g,'fin','Empate a *'+out.tope+'* con *'+listar(otros)+'*, pero *'+nameOf(g,g.winner)
        +'* controlaba la *Bisagra* y se lleva la partida con '+g.prestige[g.winner]+' de Prestigio.');
    } else if(out.anulados.length){
      addLog(g,'fin','Con los de arriba anulados, la partida cae para *'+nameOf(g,g.winner)
        +'* con '+g.prestige[g.winner]+' de Prestigio.');
    } else {
      addLog(g,'fin','Fin de la partida. Gana *'+nameOf(g,g.winner)+'* con '+g.prestige[g.winner]+' de Prestigio.');
    }
    await writeGame(g);
    return;
  }
  g.turnOrder = nextTurnOrder(g.turnOrder, g.prestige);
  g.round += 1;
  g.phase='jugar';
  g.bisagraAdvantage=null;
  g.zoneFlags={};
  g.pendingSwap=null;
  g.resolvedZones={};
  g.roundResults=[];
  g.pendingUmbralChoices=null;
  g.pendingMaintenance=null;
  g.resolveStep=0;
  g.playTurnIndex=0;
  g.attackTurnIndex=0;
  g.attackPassed={};
  drawForRound(g);
  addLog(g,'ronda','*Ronda '+g.round+'.* Abre *'+nameOf(g,g.turnOrder[0])+'* por Prestigio. Orden: '
    +g.turnOrder.map(id=>nameOf(g,id)+' ('+(g.prestige[id]||0)+')').join(' → ')+'.');
  await writeGame(g);
}

function nextTurnOrder(prevOrder, prestige){
  const groups={};
  prevOrder.forEach(id=>{ const p=prestige[id]; (groups[p]=groups[p]||[]).push(id); });
  const desc = Object.keys(groups).map(Number).sort((a,b)=>b-a);
  const out=[];
  desc.forEach(p=>{
    let grp = groups[p];
    if(grp.length>1) grp = grp.slice().reverse();
    out.push(...grp);
  });
  return out;
}

function computeFinalWinner(g){
  const r = finalOutcome(g);
  return r.winner;
}
/* Devuelve quién gana y, si hubo empate a Prestigio, cómo se resolvió. */
/* Los empatados en cabeza se anulan entre sí y la victoria baja al siguiente,
   salvo que uno de ellos controle la Bisagra: por eso ganarla vale tanto. */
function finalOutcome(g){
  let remaining = g.players.map(p=>p.id);
  let anulados = [];
  while(remaining.length>0){
    const tope = Math.max(...remaining.map(id=>g.prestige[id]||0));
    const arriba = remaining.filter(id=>(g.prestige[id]||0)===tope);
    if(arriba.length===1){
      return {winner:arriba[0], porBisagra:false, empatados:[], tope, anulados};
    }
    if(g.bisagraAdvantage && arriba.includes(g.bisagraAdvantage)){
      return {winner:g.bisagraAdvantage, porBisagra:true, empatados:arriba, tope, anulados};
    }
    anulados.push({tope, ids:arriba});
    remaining = remaining.filter(id=>arriba.indexOf(id)<0);
  }
  return {winner:null, porBisagra:false, empatados:[], tope:0, anulados};
}

/* ============================= RENDER ============================= */
function el(html){ const d=document.createElement('div'); d.innerHTML=html; return d.firstElementChild; }

/* El sondeo llamaba a render() cada 2,2 s y reconstruía toda la pantalla, lo que
   reiniciaba cualquier animación en curso. Ahora calculamos una firma del estado
   visible y solo repintamos cuando cambia de verdad. */
let lastSignature = null;
function renderSignature(){
  let stallBucket = 0;
  if(game && game.updatedAt){
    const seg = secondsStalled(game);
    if(seg >= STALL_SECONDS) stallBucket = Math.floor(seg/5);
  }
  return JSON.stringify([
    screen, errorMsg, notice, missedReads, confirmDelete, confirmLeave,
    helpOpen, rulesOpen, showManualCopy, newRoomPublic, browsing,
    roomList,
    theme, stallBucket,
    game && game.players ? game.players.map(p=>isOnline(p.id)) : null,
    ui, game
  ]);
}

function render(){
  const sig = renderSignature();
  if(sig === lastSignature) return;
  lastSignature = sig;
  paint();
}
/* Fuerza un repintado aunque la firma no haya cambiado. */
function repaint(){ lastSignature = null; render(); }

function paint(){
  const root = document.getElementById('app');
  applyTheme(root);
  root.innerHTML='';
  if(errorMsg){
    const box = el('<div class="banner" style="border:1px solid var(--danger);"></div>');
    box.appendChild(el('<div class="err">'+errorMsg+'</div>'));
    if(lastAttemptedState){
      const retryBtn = el('<button class="secondary" style="margin-top:8px;">Reintentar guardado</button>');
      retryBtn.onclick = ()=>retryLastWrite();
      box.appendChild(retryBtn);
    }
    root.appendChild(box);
  }
  if(missedReads>=4 && (screen==='lobby' || screen==='game')){
    const box = el('<div class="banner" style="border:1px solid var(--danger);"></div>');
    box.appendChild(el('<div class="err">No se consigue leer la sala desde hace unos segundos. Puede ser un fallo pasajero de conexión, o que la sala se haya eliminado.</div>'));
    const outBtn = el('<button class="secondary" style="margin-top:8px;">Salir al inicio</button>');
    outBtn.onclick = ()=>goToNotice('Has salido de la sala.');
    box.appendChild(outBtn);
    root.appendChild(box);
  }
  if(screen==='notice') root.appendChild(renderNotice());
  else if(screen==='landing' || !game) root.appendChild(renderLanding());
  else if(screen==='lobby') root.appendChild(renderLobby());
  else if(screen==='game') root.appendChild(renderGame());
  prevCards = nextCards; nextCards = {};
  prevFlags = nextFlags; nextFlags = {};
  prevHand = nextHand; nextHand = {};
  if(game && game.prestige) prevPrestige = Object.assign({}, game.prestige);
  if(game) { prevRound = game.round; prevEnded = game.status==='ended'; }

  const logEl = root.querySelector('.log');
  if(logEl){
    if(logStick) logEl.scrollTop = logEl.scrollHeight;
    else logEl.scrollTop = logScrollTop;
    logEl.addEventListener('scroll', ()=>{
      logScrollTop = logEl.scrollTop;
      logStick = (logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight) < 24;
    });
  }
}

/* Lee las salas públicas del almacén compartido. Limitamos cuántas miramos
   para no disparar el número de peticiones. */
async function refreshRooms(){
  if(!storageAvailable()){ errorMsg='Sin almacenamiento no se pueden listar salas.'; render(); return; }
  browsing = true; render();
  const out = [];
  try{
    const res = await window.storage.list('game:', true);
    const keys = (res && res.keys ? res.keys : []).slice(0, 25);
    for(const k of keys){
      try{
        const raw = await window.storage.get(k, true);
        if(!raw) continue;
        const g = JSON.parse(raw.value);
        if(g.status!=='lobby' || !g.isPublic) continue;
        if(!g.players || g.players.length>=MAX_PLAYERS) continue;
        if(Date.now() - (g.updatedAt||0) > 3600000) continue; // salas muertas
        out.push({code:g.roomCode, count:g.players.length, names:g.players.map(p=>p.name)});
      }catch(e){ /* sala ilegible: la saltamos */ }
    }
  }catch(e){ errorMsg='No se pudo consultar la lista de salas.'; }
  roomList = out;
  browsing = false;
  render();
}

/* Copiar al portapapeles. Dentro del iframe del artifact la API moderna suele
   estar bloqueada, así que probamos varias vías y, si ninguna funciona,
   devolvemos false para ofrecer copia manual. */
async function copyText(text){
  try{
    if(typeof navigator!=='undefined' && navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
      return true;
    }
  }catch(e){ /* seguimos con el respaldo */ }
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly','');
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.style.left = '0';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    if(ta.setSelectionRange) ta.setSelectionRange(0, text.length);
    const ok = document.execCommand && document.execCommand('copy');
    document.body.removeChild(ta);
    return !!ok;
  }catch(e){ return false; }
}

  }

  if(g.hostId===myId && g.players.length<MAX_PLAYERS){
    const botBtn = el('<button class="secondary">Añadir jugador automático</button>');
    botBtn.onclick = ()=>addBot();
    wrap.appendChild(botBtn);
    wrap.appendChild(el('<div class="small">Juegan solos siguiendo su propio criterio. Sirven para completar una partida o para practicar.</div>'));
  }

  if(g.hostId===myId){
    const startBtn = el('<button>Empezar partida</button>');
    startBtn.disabled = g.players.length<2;
    startBtn.onclick = ()=>startGame();
    wrap.appendChild(startBtn);
  } else {
    wrap.appendChild(el('<p>Ya estás dentro. El anfitrión dará comienzo cuando estéis todos.</p>'));
  }

  wrap.appendChild(el('<div class="divider"></div>'));
  const actions = el('<div class="row"></div>');
  const leaveBtn = el('<button class="secondary">Salir de la sala</button>');
  leaveBtn.onclick = ()=>leaveRoom();
  actions.appendChild(leaveBtn);
  if(g.hostId===myId){
    const delBtn = el('<button class="danger">Eliminar sala</button>');
    delBtn.onclick = ()=>{
      if(confirmDelete){ closeRoom(); }
      else { confirmDelete=true; render(); }
    };
    actions.appendChild(delBtn);
  }
  wrap.appendChild(actions);
  if(confirmDelete && g.hostId===myId){
    const warn = el('<div class="modal-inline"></div>');
    warn.appendChild(el('<div><strong>¿Eliminar la sala para todos?</strong></div>'));
    warn.appendChild(el('<div class="small" style="margin-top:4px;">Los demás volverán a la pantalla de inicio. No se puede deshacer.</div>'));
    const row = el('<div class="row" style="margin-top:8px;"></div>');
    const yes = el('<button class="danger">Sí, eliminar</button>');
    yes.onclick = ()=>{ confirmDelete=false; closeRoom(); };
    const no = el('<button class="secondary">Cancelar</button>');
    no.onclick = ()=>{ confirmDelete=false; render(); };
    row.appendChild(yes); row.appendChild(no);
    warn.appendChild(row);
    wrap.appendChild(warn);
  }

  return wrap;
}

/* Une nombres en lenguaje natural: "Ana", "Ana y Bruno", "Ana, Bruno y Carla". */
function listar(nombres){
  if(!nombres.length) return '';
  if(nombres.length===1) return nombres[0];
  return nombres.slice(0,-1).join(', ')+' y '+nombres[nombres.length-1];
}
function pendingUmbralPlayers(g){
  if(!g.pendingUmbralChoices) return '';
  const ids = Object.keys(g.pendingUmbralChoices)
    .filter(cid=>g.pendingUmbralChoices[cid]===null)
    .map(cid=>{ const e=g.zones.umbral.find(x=>x.card.id===cid); return e && e.card.owner; })
    .filter(Boolean);
  const unicos = g.players.filter(p=>ids.indexOf(p.id)>-1).map(p=>p.name);
  return listar(unicos);
}

function renderStallPanel(g){
  if(!g || (g.status!=='playing' && g.status!=='lobby')) return null;
  const espera = waitingOn(g);
  if(!espera || espera.id===myId) return null;
  if(isBot(g, espera.id) && g.hostId===myId) return null; // la mueve este mismo cliente
  const seg = secondsStalled(g);
  if(seg < STALL_SECONDS) return null;

  const quien = nameOf(g, espera.id);
  const jugador = g.players.find(p=>p.id===espera.id);
  const ausente = !!(jugador && jugador.away);
  const box = el('<div class="stall"></div>');
  const mins = seg>=90 ? (Math.floor(seg/60)+' min') : (seg+' s');
  box.appendChild(el('<div class="stall-head">'+(ausente
    ? escapeHtml(quien)+' se ha desconectado'
    : 'La partida lleva '+mins+' parada')+'</div>'));
  box.appendChild(el('<div class="stall-body">Se espera a <strong>'+escapeHtml(quien)+'</strong> para '+escapeHtml(espera.que)+'.'
    +(ausente ? ' Puede volver entrando con el código <strong>'+g.roomCode+'</strong> y su mismo nombre.' : '')+'</div>'));
  const restante = GRACE_SECONDS - seg;
  if(restante > 0){
    box.appendChild(el('<div class="small" style="margin-top:4px;">Quedan '+Math.ceil(restante/60)+' min de cortesía antes de poder cerrar la partida sin '+escapeHtml(quien)+'.</div>'));
  }

  const row = el('<div class="row" style="margin-top:9px;"></div>');

  if(espera.puedeSaltarse){
    const b = el('<button>Saltar su intercambio</button>');
    b.onclick = ()=>skipSwapFor(espera.id);
    row.appendChild(b);
    box.appendChild(el('<div class="small" style="margin-top:6px;">La J se queda donde está y la partida continúa.</div>'));
  }

  if(espera.puedePasarse){
    const b = el('<button>Pasar su turno de ataque</button>');
    b.onclick = ()=>passAttackFor(espera.id);
    row.appendChild(b);
    box.appendChild(el('<div class="small" style="margin-top:6px;">Pasar por él no altera el tablero: solo renuncia a sus Ataques de esta ronda.</div>'));
  }

  if(espera.esAnfitrion && g.hostId!==myId){
    const b = el('<button>Continuar yo</button>');
    b.onclick = ()=>claimHost();
    row.appendChild(b);
    box.appendChild(el('<div class="small" style="margin-top:6px;">Pasarás a ser el anfitrión y podrás hacer avanzar la partida. El resultado es idéntico al que habría salido con el anfitrión anterior.</div>'));
  } else if(!espera.esAnfitrion && g.hostId!==myId && g.hostId===espera.id){
    const b = el('<button class="secondary">Tomar el control</button>');
    b.onclick = ()=>claimHost();
    row.appendChild(b);
  } else if(!espera.esAnfitrion && !espera.puedePasarse && g.hostId!==myId){
    const b = el('<button class="secondary">Tomar el control</button>');
    b.onclick = ()=>claimHost();
    row.appendChild(b);
    box.appendChild(el('<div class="small" style="margin-top:6px;">Si '+escapeHtml(quien)+' no vuelve, como anfitrión podrás cerrar la partida.</div>'));
  }

  if(seg >= GRACE_SECONDS){
    const b = el('<button class="danger">Terminar la partida</button>');
    b.onclick = ()=>endEarly();
    row.appendChild(b);
    box.appendChild(el('<div class="small" style="margin-top:6px;">Se acabó la cortesía. Puedes cerrarla con el marcador tal y como está ahora.</div>'));
  }
  if(row.children.length>0) box.appendChild(row);
  return box;
}

function renderGame(){
  const g = game;
  const wrap = el('<div class="stack" style="gap:14px;"></div>');

  // topbar
  const top = el('<div class="topbar"></div>');
  const titleBox = el('<div></div>');
  titleBox.appendChild(el('<h1>4 Zonas</h1>'));
  titleBox.appendChild(el('<div class="small">Ronda '+g.round+' de 4 · Sala '+g.roomCode+' · '+phaseLabel(g)+'</div>'));
  titleBox.appendChild(themeToggle());
  const helpBtn = el('<button class="secondary small-btn" style="margin-top:6px;">Ver cartas y zonas</button>');
  helpBtn.onclick = ()=>{ helpOpen = !helpOpen; render(); };
  titleBox.appendChild(helpBtn);
  top.appendChild(titleBox);

  const scoreboard = el('<div class="scoreboard"></div>');
  g.players.forEach(p=>{
    const isTurn = isPlayersTurn(g,p.id);
    const chip = el('<div class="score-chip '+seatClass(g,p.id)+(p.id===myId?' me':'')+(isTurn?' turn':'')+'"></div>');

    const head = el('<div class="chip-head"></div>');
    const pos = (g.turnOrder||[]).indexOf(p.id);
    if(pos>=0) head.appendChild(el('<span class="chip-ord" title="Orden de turno esta ronda">'+(pos+1)+'.º</span>'));
    head.appendChild(el('<span class="seat-mark">'+markOf(g,p.id)+'</span>'));
    head.appendChild(el('<span class="chip-name">'+escapeHtml(p.name)+'</span>'));
    if(p.id===myId) head.appendChild(el('<span class="chip-you">tú</span>'));
    if(p.bot) head.appendChild(el('<span class="chip-bot" title="Jugador automático">⌬</span>'));
    if(g.bisagraAdvantage===p.id) head.appendChild(el('<span class="chip-adv" title="Ganó Bisagra: gana los empates esta ronda">⚖</span>'));
    chip.appendChild(head);

    const stats = el('<div class="chip-stats"></div>');
    const antes = prevPrestige[p.id];
    const ahora = g.prestige[p.id]||0;
    const subida = (antes!==undefined && ahora>antes) ? (ahora-antes) : 0;
    const pres = el('<div class="stat'+(subida?' anim-gain':'')+'"></div>');
    pres.appendChild(el('<span class="stat-num">'+ahora+'</span>'));
    pres.appendChild(el('<span class="stat-lbl">'+PRESTIGE_GLYPH+' Prestigio</span>'));
    if(subida) pres.appendChild(el('<span class="float-gain">+'+subida+'</span>'));
    stats.appendChild(pres);
    const atk = el('<div class="stat"></div>');
    atk.appendChild(el('<span class="stat-num">'+(g.tokens[p.id]||0)+'</span>'));
    atk.appendChild(el('<span class="stat-lbl">Ataques</span>'));
    stats.appendChild(atk);
    chip.appendChild(stats);

    let estado = '';
    if(g.status==='playing'){
      if(g.phase==='jugar') estado = (g.playedThisRound[p.id]||0)+' de 3 cartas jugadas';
      else if(g.phase==='atacar') estado = g.attackPassed[p.id] ? 'ya ha pasado' : 'aún puede atacar';
      else if(g.phase==='resolver') estado = 'resolviendo zonas';
      else if(g.phase==='mantenimiento') estado = 'fin de ronda';
    }
    chip.appendChild(el('<div class="chip-state">'+escapeHtml(estado)+'</div>'));
    chip.appendChild(el('<div class="chip-cards">Mazo '+(g.decks[p.id]||[]).length+' · Descarte '+(g.discard[p.id]||[]).length+'</div>'));
    if(isTurn) chip.appendChild(el('<div class="chip-turn">Su turno</div>'));
    scoreboard.appendChild(chip);
  });
  top.appendChild(scoreboard);
  wrap.appendChild(top);

  if(helpOpen){
    const h = el('<div class="panel stack help-panel"></div>');
    const hh = el('<div class="row" style="justify-content:space-between;align-items:baseline;"></div>');
    hh.appendChild(el('<h2>Recordatorio</h2>'));
    const cerrar = el('<button class="secondary small-btn">Cerrar</button>');
    cerrar.onclick = ()=>{ helpOpen=false; render(); };
    hh.appendChild(cerrar);
    h.appendChild(hh);
    h.appendChild(el('<h3>Las cartas especiales</h3>'));
    h.appendChild(renderCardHelp());
    h.appendChild(el('<h3>Qué gana cada punto</h3>'));
    h.appendChild(renderZoneHelp());
    wrap.appendChild(h);
  }

  wrap.appendChild(renderBanner(g));
  const stall = renderStallPanel(g);
  if(stall) wrap.appendChild(stall);

  // zones
  // En pantalla se ordenan por su altura en la ciudad (Cima arriba, Foso abajo).
  // El orden de resolución se indica con un número en cada zona.
  const grid = el('<div class="zones-grid"></div>');
  ZONE_DISPLAY.forEach(zk=> grid.appendChild(renderZone(g, zk)));
  wrap.appendChild(grid);

  if(!swapMode() && g.phase==='atacar' && ui.pendingAttack){
    const {zone, cardId} = ui.pendingAttack;
    const entry = findLiveEntry(g, zone, cardId);
    if(!entry){
      ui.pendingAttack=null;
    } else {
      const box = el('<div class="modal-inline"></div>');
      const quien = nameOf(g,entry.card.owner);
      const desc = entry.faceUp
        ? ('el '+cardLabel(entry.card.value)+' de '+quien+' en '+ZONE_LABEL[zone])
        : ('una carta oculta de '+quien+' en '+ZONE_LABEL[zone]);
      const efecto = entry.faceUp
        ? (entry.attackedOnce ? 'Ya estaba señalada: este Ataque la derriba.' : 'Quedará señalada. Hará falta un segundo Ataque para derribarla.')
        : 'Quedará al descubierto y caerá. Si resulta ser una K o un As, se activará en tu contra.';
      box.appendChild(el('<div><strong>¿Atacar '+desc+'?</strong></div>'));
      box.appendChild(el('<div class="small" style="margin-top:3px;">'+efecto+'</div>'));
      box.appendChild(el('<div class="small" style="margin-top:4px;">Cuesta 1 Ataque. Te quedan '+g.tokens[myId]+'.</div>'));
      const row = el('<div class="row" style="margin-top:8px;"></div>');
      const confirmBtn = el('<button>Gastar 1 Ataque</button>');
      confirmBtn.onclick = ()=>confirmAttack();
      const cancelBtn = el('<button class="secondary">Cancelar</button>');
      cancelBtn.onclick = ()=>cancelAttack();
      row.appendChild(confirmBtn); row.appendChild(cancelBtn);
      box.appendChild(row);
      wrap.appendChild(box);
    }
  }

  if(g.phase==='atacar' && currentAttacker(g)===myId && !g.attackPassed[myId] && g.status==='playing'){
    const panel = el('<div class="panel stack" style="gap:10px;"></div>');
    panel.appendChild(el('<h2>Tu turno de ataque</h2>'));
    const tk = g.tokens[myId]||0;
    const hechos = g.turnAttacks||0;
    panel.appendChild(el('<div class="small">'
      +(hechos>0 ? 'Llevas <strong>'+hechos+'</strong> Ataque'+(hechos===1?'':'s')+' este turno. ' : '')
      +(tk>0
        ? 'Te quedan <strong>'+tk+'</strong>. Toca una carta rival para exigir que se muestre, o cierra tu turno.'
        : 'No te quedan Ataques.')+'</div>'));
    const yaAtaco = (g.turnAttacks||0) > 0;
    const passBtn = el('<button>'+(yaAtaco
      ? 'Terminar mi turno de ataque'
      : (tk>0 ? 'Pasar sin atacar' : 'Pasar turno'))+'</button>');
    passBtn.onclick = ()=>passAttack();
    panel.appendChild(passBtn);
    wrap.appendChild(panel);
  }



  // Elección de modificador en Umbral. NO revelamos el valor de la carta:
  // saber qué escondiste forma parte del juego de memoria.
  if(g.phase==='resolver' && g.pendingUmbralChoices){
    const misOcultas = g.zones.umbral.filter(e=>e.card.owner===myId && e.originalFaceDown && !e.discarded);
    const mine = misOcultas.filter(e=>g.pendingUmbralChoices[e.card.id]===null);
    if(mine.length>0){
      const target = mine[0];
      const pos = misOcultas.indexOf(target)+1;
      ui.highlightCardId = target.card.id;
      const box = el('<div class="modal-inline"></div>');
      box.appendChild(el('<div><strong>Modificador en Umbral</strong></div>'));
      box.appendChild(el('<div class="small" style="margin-top:3px;">Tu <strong>'+pos+'.ª</strong> carta oculta en Umbral'+(misOcultas.length>1?(' de '+misOcultas.length):'')+', señalada en el tablero. Decide si suma o resta 1 a tu total.</div>'));
      const btns = el('<div class="row" style="margin-top:9px;"></div>');
      const plus = el('<button>+1</button>');
      plus.onclick=()=>{ ui.highlightCardId=null; submitUmbralChoice(target.card.id,1); };
      const minus = el('<button class="secondary">−1</button>');
      minus.onclick=()=>{ ui.highlightCardId=null; submitUmbralChoice(target.card.id,-1); };
      btns.appendChild(plus); btns.appendChild(minus);
      box.appendChild(btns);
      if(mine.length>1) box.appendChild(el('<div class="small" style="margin-top:7px;">Después decidirás las '+(mine.length-1)+' restantes.</div>'));
      wrap.appendChild(box);
    } else {
      ui.highlightCardId = null;
    }
  }

  // Mantenimiento: colocar la carta sobrante
  if(g.phase==='mantenimiento' && g.pendingMaintenance && g.pendingMaintenance[myId]===false){
    const box = el('<div class="modal-inline"></div>');
    box.appendChild(el('<div><strong>Te sobra una carta</strong></div>'));
    box.appendChild(el('<div class="small" style="margin-top:3px;">Devuélvela al mazo: encima la volverás a robar pronto, debajo tardarás en verla. No hay turnos: hazlo cuando quieras.</div>'));
    const row = el('<div class="row" style="margin-top:9px;"></div>');
    const topBtn = el('<button>Encima</button>'); topBtn.onclick=()=>submitMaintenanceChoice(true);
    const botBtn = el('<button class="secondary">Debajo</button>'); botBtn.onclick=()=>submitMaintenanceChoice(false);
    row.appendChild(topBtn); row.appendChild(botBtn);
    box.appendChild(row);
    wrap.appendChild(box);
  }

  // Controles del anfitrión para hacer avanzar la partida
  if(g.hostId===myId && g.status==='playing'){
    if(g.phase==='resolver'){
      if(umbralChoicesPending(g)){
        const quienes = pendingUmbralPlayers(g);
        wrap.appendChild(el('<div class="banner">Umbral: esperando a que '+escapeHtml(quienes)+' decida'+(quienes.indexOf(' y ')>-1?'n':'')+' el modificador de sus cartas ocultas. Podrás continuar cuando terminen.</div>'));
      } else {
        const btn = el('<button>Resolver '+ZONE_LABEL[ZONE_ORDER[g.resolveStep]]+'</button>');
        btn.onclick = ()=>resolveCurrentZone();
        wrap.appendChild(btn);
      }
    }
    if(g.phase==='mantenimiento'){
      if(maintenancePending(g)){
        const faltan = g.players.filter(p=>g.pendingMaintenance && g.pendingMaintenance[p.id]===false).map(p=>p.name);
        wrap.appendChild(el('<div class="banner">Cada uno coloca su carta sobrante cuando quiera, sin turnos. Faltan '+escapeHtml(listar(faltan))+'.</div>'));
      } else {
        const btn = el('<button>'+(g.round>=4?'Terminar partida':'Empezar ronda '+(g.round+1))+'</button>');
        btn.onclick = ()=>nextRoundOrEnd();
        wrap.appendChild(btn);
      }
    }
  } else if(g.status==='playing' && (g.phase==='resolver' || g.phase==='mantenimiento')){
    const esperando = g.phase==='resolver' && umbralChoicesPending(g)
      ? 'Umbral: esperando los modificadores de '+pendingUmbralPlayers(g)+'.'
      : 'Esperando a que '+nameOf(g,g.hostId)+' continúe.';
    wrap.appendChild(el('<div class="banner">'+escapeHtml(esperando)+'</div>'));
  }

  if(g.status==='ended'){
    const box = el('<div class="panel stack finale'+(prevEnded?'':' anim-finale')+'"></div>');
    if(!prevEnded && g.winner){
      const conf = el('<div class="confetti"></div>');
      for(let i=0;i<26;i++){
        conf.appendChild(el('<i class="c'+(i%4)+'" style="left:'+(3+i*3.7)+'%;animation-delay:'+((i%9)*90)+'ms"></i>'));
      }
      box.appendChild(conf);
    }
    box.appendChild(el('<h2>Partida terminada</h2>'));
    const out = finalOutcome(g);
    box.appendChild(el('<div>'+(g.winner
      ? 'La ciudad reconoce a <strong>'+escapeHtml(nameOf(g,g.winner))+'</strong> con '+g.prestige[g.winner]+' de Prestigio.'
      : 'Todas las casas quedaron empatadas y anuladas entre sí. La ciudad no reconoce a nadie.')+'</div>'));
    if(g.winner && (out.porBisagra || out.anulados.length)){
      const tb = el('<div class="tiebreak"></div>');
      out.anulados.forEach(a=>{
        tb.appendChild(el('<div>Empate a <strong>'+a.tope+'</strong> entre '
          +escapeHtml(listar(a.ids.map(id=>nameOf(g,id))))
          +': se anulan entre sí y quedan fuera del reparto.</div>'));
      });
      if(out.porBisagra){
        const otros = out.empatados.filter(id=>id!==g.winner).map(id=>nameOf(g,id));
        tb.appendChild(el('<div><strong>Empate a '+out.tope+' de Prestigio</strong> con '+escapeHtml(listar(otros))
          +', pero <strong>'+escapeHtml(nameOf(g,g.winner))+'</strong> controlaba la <strong>Bisagra</strong> en la última ronda y se lleva la partida.</div>'));
      } else if(out.anulados.length){
        tb.appendChild(el('<div>Con los de arriba anulados, la victoria baja hasta <strong>'
          +escapeHtml(nameOf(g,g.winner))+'</strong>.</div>'));
      }
      box.appendChild(tb);
    }
    const table = el('<ul class="players-list"></ul>');
    g.players.slice().sort((a,b)=>g.prestige[b.id]-g.prestige[a.id]).forEach((p,i)=>{
      table.appendChild(el('<li class="'+seatClass(g,p.id)+' anim-rank" style="animation-delay:'+(i*110)+'ms">'
        +'<span class="seat-mark">'+markOf(g,p.id)+'</span> '+escapeHtml(p.name)
        +'<strong class="rank-score">'+PRESTIGE_GLYPH+g.prestige[p.id]+'</strong></li>'));
    });
    box.appendChild(table);
    if(g.hostId===myId){
      const again = el('<button>Jugar otra</button>');
      again.onclick = ()=>rematch();
      box.appendChild(again);
    } else {
      box.appendChild(el('<p>El anfitrión puede montar otra partida con los mismos jugadores.</p>'));
    }
    wrap.appendChild(box);
  }

  // my hand
  if(swapMode() && !swapPosible(g)){ cancelJSwap(); }
  if(g.status==='playing' && ((g.hands[myId]||[]).length>0 || swapMode())){
    wrap.appendChild(renderHand(g));
  }

  // registro
  const logPanel = el('<div class="panel stack" style="gap:8px;"></div>');
  const logHead = el('<div class="row" style="justify-content:space-between;align-items:baseline;"></div>');
  logHead.appendChild(el('<h2>Registro</h2>'));
  logHead.appendChild(el('<span class="small">'+(logStick?'al día':'has subido a leer')+'</span>'));
  logPanel.appendChild(logHead);
  const log = el('<div class="log"></div>');
  (g.log||[]).slice(-60).forEach(line=>{
    if(typeof line === 'string'){
      log.appendChild(el('<div class="log-line"><span class="log-icon">·</span><span>'+escapeHtml(line)+'</span></div>'));
    } else {
      log.appendChild(el('<div class="log-line k-'+(line.k||'')+'"><span class="log-icon">'+escapeHtml(line.i||'·')+'</span><span>'+formatLogText(line.t)+'</span></div>'));
    }
  });
  logPanel.appendChild(log);
  wrap.appendChild(logPanel);

  // acciones de sala durante la partida
  const roomActions = el('<div class="row"></div>');
  const leaveBtn = el('<button class="secondary small-btn">'+(g.status==='playing'?'Abandonar':'Salir de la sala')+'</button>');
  leaveBtn.onclick = ()=>{
    if(confirmLeave){ confirmLeave=false; leaveRoom(); }
    else { confirmLeave=true; render(); }
  };
  roomActions.appendChild(leaveBtn);
  if(g.hostId===myId){
    const closeBtn = el('<button class="danger small-btn">Cerrar para todos</button>');
    closeBtn.onclick = ()=>{
      if(confirmDelete){ confirmDelete=false; closeRoom(); }
      else { confirmDelete=true; render(); }
    };
    roomActions.appendChild(closeBtn);
  }
  wrap.appendChild(roomActions);
  if(confirmLeave){
    const warn = el('<div class="modal-inline"></div>');
    warn.appendChild(el('<div><strong>'+(g.status==='playing'
      ? '¿Abandonar la partida?'
      : '¿Salir de la sala?')+'</strong></div>'));
    if(g.status==='playing') warn.appendChild(el('<div class="small" style="margin-top:3px;">La partida terminará para todos: no puede continuar sin uno de los jugadores.</div>'));
    const row = el('<div class="row" style="margin-top:8px;"></div>');
    const yes = el('<button class="danger">Sí, salir</button>');
    yes.onclick = ()=>{ confirmLeave=false; leaveRoom(); };
    const no = el('<button class="secondary">Cancelar</button>');
    no.onclick = ()=>{ confirmLeave=false; render(); };
    row.appendChild(yes); row.appendChild(no);
    warn.appendChild(row);
    wrap.appendChild(warn);
  }
  if(confirmDelete && g.hostId===myId){
    const warn = el('<div class="modal-inline"></div>');
    warn.appendChild(el('<div><strong>¿Cerrar la partida para todos?</strong></div>'));
    const row = el('<div class="row" style="margin-top:8px;"></div>');
    const yes = el('<button class="danger">Sí, cerrar</button>');
    yes.onclick = ()=>{ confirmDelete=false; closeRoom(); };
    const no = el('<button class="secondary">Cancelar</button>');
    no.onclick = ()=>{ confirmDelete=false; render(); };
    row.appendChild(yes); row.appendChild(no);
    warn.appendChild(row);
    wrap.appendChild(warn);
  }

  return wrap;
}

function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

function phaseLabel(g){
  return {jugar:'Jugando cartas', atacar:'Ataques', resolver:'Resolución', mantenimiento:'Fin de ronda'}[g.phase] || g.phase;
}
function isPlayersTurn(g,id){
  if(g.status!=='playing') return false;
  if(g.phase==='jugar') return currentPlayTurnPlayer(g)===id;
  if(g.phase==='atacar') return currentAttacker(g)===id && !g.attackPassed[id];
  return false;
}

function renderBanner(g){
  let text='';
  if(g.status==='ended') return el('<div></div>');
  if(g.phase==='jugar'){
    const cur = currentPlayTurnPlayer(g);
    text = cur===myId
      ? 'Tu turno: juega una carta. Llevas '+(g.playedThisRound[myId]||0)+' de 3.'
      : 'Turno de '+nameOf(g,cur)+'. Tú llevas '+(g.playedThisRound[myId]||0)+' de 3 cartas jugadas.';
  } else if(g.phase==='atacar'){
    const cur = currentAttacker(g);
    text = cur===myId ? 'Tu turno de ataque.' : 'Turno de ataque de '+nameOf(g,cur)+'.';
  } else if(g.phase==='resolver'){
    text = 'Resolución por orden de zonas. Toca '+ZONE_LABEL[ZONE_ORDER[g.resolveStep]]+'.';
  } else if(g.phase==='mantenimiento'){
    text = g.round>=4 ? 'Última ronda resuelta. Repasad el tablero antes de terminar.' : 'Ronda '+g.round+' resuelta. Repasad el tablero antes de la siguiente.';
  }
  const cls = isPlayersTurn(g,myId) ? 'banner action' : 'banner';
  return el('<div class="'+cls+'">'+text+'</div>');
}

function renderZone(g, zk){
  const resolved = !!(g.resolvedZones && g.resolvedZones[zk]);
  const resolvingNow = g.phase==='resolver' && ZONE_ORDER[g.resolveStep]===zk;
  const zone = el('<div class="zone '+zk+(resolvingNow?' resolving':'')+(resolved?' resolved':'')+'"></div>');

  const head = el('<div class="zone-head"></div>');
  const titleWrap = el('<div class="zone-title"></div>');
  titleWrap.appendChild(el(ZONE_ICON[zk]));
  titleWrap.appendChild(el('<h2>'+ZONE_LABEL[zk]+'</h2>'));
  const fl = (g.zoneFlags && g.zoneFlags[zk]) || {};
  const nuevaMarca = zoneFlagAnim(g, zk);
  if(fl.eclipse){
    const duenos = fl.eclipseBy && fl.eclipseBy.length ? fl.eclipseBy : [];
    if(duenos.length){
      duenos.forEach(id=> titleWrap.appendChild(el('<span class="tag eclipse '+seatClass(g,id)+nuevaMarca+'" title="El As de '+escapeHtml(nameOf(g,id))+' quedó al descubierto: el estrato queda en entredicho y nadie lo gana">★ As '+markOf(g,id)+'</span>')));
    } else {
      titleWrap.appendChild(el('<span class="tag eclipse'+nuevaMarca+'" title="Un As al descubierto deja el estrato en entredicho: nadie lo gana">★ As</span>'));
    }
  }
  if(fl.coronation && fl.coronation.length){
    fl.coronation.forEach(id=> titleWrap.appendChild(el('<span class="tag coronacion '+seatClass(g,id)+nuevaMarca+'" title="La K de '+escapeHtml(nameOf(g,id))+' quedó al descubierto: un nombre que nadie discute se lleva la zona">★ K '+markOf(g,id)+'</span>')));
  }
  if(zk==='bisagra') titleWrap.appendChild(el('<span class="tag neutral">'+liveCards(g,'bisagra').length+'/2</span>'));
  if(resolved) titleWrap.appendChild(el('<span class="tag done">resuelta</span>'));
  titleWrap.appendChild(el('<span class="ord" title="Orden de resolución">'+(ZONE_ORDER.indexOf(zk)+1)+'.º</span>'));
  const topRow = el('<div class="zone-toprow"></div>');
  topRow.appendChild(titleWrap);
  topRow.appendChild(elevationRail(zk));
  head.appendChild(topRow);
  head.appendChild(el('<span class="zone-flavor">'+ZONE_FLAVOR[zk]+'</span>'));
  head.appendChild(el('<span class="cond">'+ZONE_COND[zk]+'</span>'));
  zone.appendChild(head);

  // Cartas agrupadas por jugador, en el orden de asiento
  const groups = el('<div class="zone-groups"></div>');
  const byOwner = {};
  g.zones[zk].forEach(e=>{ (byOwner[e.card.owner] = byOwner[e.card.owner] || []).push(e); });
  const owners = g.players.map(p=>p.id).filter(id=>byOwner[id] && byOwner[id].length);
  owners.forEach(id=>{
    const grp = el('<div class="owner-group '+seatClass(g,id)+'"></div>');
    const lbl = el('<div class="owner-label">'+markOf(g,id)+' '+escapeHtml(nameOf(g,id))+(id===myId?' (tú)':'')+'</div>');
    if(resolved && zk==='umbral'){
      const suma = byOwner[id].filter(e=>!e.discarded).reduce((n,e)=>n+finalValue('umbral',e),0);
      lbl.appendChild(el('<span class="sum'+(suma>11?' bust':'')+'">'+suma+(suma>11?' ✗':'')+'</span>'));
    }
    grp.appendChild(lbl);
    const row = el('<div class="zone-cards"></div>');
    byOwner[id].forEach(e=> row.appendChild(renderZoneCard(g, zk, e)));
    grp.appendChild(row);
    groups.appendChild(grp);
  });
  if(owners.length===0 && !ghostHere(g, zk)) groups.appendChild(el('<div class="empty-zone">Sin cartas</div>'));

  // Al elegir una carta de la mano aparece aquí, en fantasma, con lo que valdría
  const fantasma = ghostHere(g, zk);
  if(fantasma){
    const grp = el('<div class="owner-group ghost-group '+seatClass(g,myId)+'"></div>');
    grp.appendChild(el('<div class="owner-label">jugarías aquí</div>'));
    const row = el('<div class="zone-cards"></div>');
    row.appendChild(fantasma);
    grp.appendChild(row);
    groups.appendChild(grp);
  }
  zone.appendChild(groups);

  if(resolvingNow){
    zone.appendChild(el('<div class="sweep"></div>'));
    zone.appendChild(el('<div class="zone-status">Resolviendo…</div>'));
  }
  if(resolved){
    const r = (g.roundResults||[]).find(x=>x.zone===zk);
    if(r) zone.appendChild(renderZoneResult(g, r));
  }
  return zone;
}

/* Pequeña escala que sitúa la zona en la vertical de la ciudad. */
function elevationRail(zk){
  const idx = ZONE_ELEV[zk];
  let t = '';
  for(let i=0;i<4;i++) t += '<i class="'+(i===idx?'on':'')+'"></i>';
  return el('<div class="elev" title="Altura en la ciudad">'+t+'</div>');
}

/* La carta que estás a punto de jugar, dibujada en la zona correspondiente. */
function ghostHere(g, zk){
  if(g.phase!=='jugar' || ui.selectedHandCard===null || swapMode()) return null;
  if(currentPlayTurnPlayer(g)!==myId) return null;
  const mano = g.hands[myId]||[];
  const card = mano[ui.selectedHandCard];
  if(!card) return null;
  const llena = (zk==='bisagra' && liveCards(g,'bisagra').length>=2);
  const abajo = ui.orientation==='down';
  const elegida = ui.selectedZone===zk;

  const c = el('<div class="card ghost '+seatClass(g,myId)
    +(abajo?' back':'')+(llena?' ghost-off':(elegida?' ghost-sel':' ghost-pulse'))+'"></div>');
  c.appendChild(el('<div class="cface">'+(abajo?'<span class="val">?</span>':cardFaceHTML(card.value))+'</div>'));

  if(llena){
    c.appendChild(el('<div class="cfoot">llena</div>'));
  } else {
    // Boca abajo la carta no se ve, así que lo útil es el valor con el que
    // competiría, no el modificador.
    const pv = previewValue(zk, card.value, abajo);
    const pie = abajo ? pv.txt : (isSpecial(card.value) ? String(baseValue(card.value)) : '');
    if(pie) c.appendChild(el('<div class="cfoot">'+pie+'</div>'));
    c.onclick = ()=>{ ui.selectedZone = (ui.selectedZone===zk ? null : zk); render(); };
  }
  return c;
}

function renderZoneResult(g, r){
  const box = el('<div class="zone-result anim-result"></div>');
  if(r.winner){
    const head = el('<div class="res-win '+seatClass(g,r.winner)+'"></div>');
    head.appendChild(el('<span class="res-mark">'+markOf(g,r.winner)+'</span>'));
    head.appendChild(el('<strong>'+escapeHtml(nameOf(g,r.winner))+'</strong>'));
    head.appendChild(el('<span class="res-gain">'+escapeHtml(r.gains)+'</span>'));
    box.appendChild(head);
  } else {
    box.appendChild(el('<div class="res-none">— Nadie gana la zona</div>'));
  }
  box.appendChild(el('<div class="res-why">'+escapeHtml(r.reason)+'</div>'));
  if(r.advantage) box.appendChild(el('<div class="res-adv">⚖ Desempate por la ventaja de Bisagra</div>'));
  return box;
}

function renderZoneCard(g, zk, entry){
  const isMine = entry.card.owner===myId;
  const resolved = !!(g.resolvedZones && g.resolvedZones[zk]);
  const dead = !!entry.discarded;
  const base = baseValue(entry.card.value);
  const fin = finalValue(zk, entry);
  const mod = fin - base;

  let classes = 'card '+seatClass(g, entry.card.owner);
  if(isMine) classes+=' mine';
  if(dead) classes+=' dead';
  if(!dead && entry.attackedOnce) classes+=' marked';
  if(ui.pendingAttack && ui.pendingAttack.cardId===entry.card.id) classes+=' selected';
  if(ui.highlightCardId===entry.card.id) classes+=' focus';
  if(entry.faceUp && isSpecial(entry.card.value)) classes+=' special';
  if(entry.faceUp && entry.originalFaceDown) classes+=' was-hidden';
  if(!entry.faceUp) classes+=' back';

  let clickable = false;
  if(!dead){
    if(swapMode()) clickable = true;
    else if(g.phase==='atacar' && currentAttacker(g)===myId && !g.attackPassed[myId] && !isMine) clickable = true;
  }
  if(clickable) classes+=' clickable';
  classes += cardAnim(entry, zk);

  const c = el('<div class="'+classes+'"></div>');

  if(!entry.faceUp){
    c.appendChild(el('<div class="cface"><span class="val">?</span></div>'));
  } else {
    // Manda siempre la carta. Debajo, en pequeño, lo que haga falta saber.
    c.appendChild(el('<div class="cface">'+cardFaceHTML(entry.card.value)+'</div>'));
    let pie = '';
    if(isSpecial(entry.card.value)){
      pie = (resolved && mod!==0 && !dead) ? (base+'→'+fin) : String(base);
    } else if(resolved && mod!==0 && !dead){
      pie = base+'→'+fin;
    }
    if(pie) c.appendChild(el('<div class="cfoot">'+pie+'</div>'));
  }

  if(entry.activated) c.appendChild(el('<div class="badge act" title="Se activó su habilidad">★</div>'));
  if(dead) c.appendChild(el('<div class="dead-note">'+escapeHtml(entry.discardedBy||'')+'</div>'));

  if(swapMode() && !dead){
    if(ui.jSwapPicks.some(p=>p.cardId===entry.card.id)) c.className = c.className+' picked';
    c.onclick = ()=>pickJSwapTarget(zk, entry);
  } else if(clickable){
    c.onclick = ()=>requestAttack(zk, entry);
  }
  return c;
}

/* Cuánto valdría esta carta en esa zona con la orientación elegida. */
function previewValue(zk, value, faceDown){
  const base = baseValue(value);
  if(!faceDown) return {txt:String(base), nota:''};
  if(zk==='cima') return {txt:String(base+2), nota:'+2'};
  if(zk==='foso') return {txt:String(base-2), nota:'−2'};
  if(zk==='umbral') return {txt:(base-1)+'/'+(base+1), nota:'±1'};
  return {txt:String(base), nota:'sin cambio'};
}

/* Qué provoca una carta especial según se juegue a la vista o en secreto. */
const SPECIAL_PLAY = {
  J:{ up:'Al jugarla podrás intercambiar de zona dos cartas cualesquiera de la mesa.',
      down:'Oculta no hace nada. Si la atacan, cae como cualquier otra carta.' },
  Q:{ up:'Al jugarla ataca de golpe todas las cartas ocultas de esa zona, gratis.',
      down:'Oculta no hace nada. Si la atacan, cae como cualquier otra carta.' },
  K:{ up:'A la vista no hace nada: solo se activa si la atacan estando oculta.',
      down:'Si la atacan, te llevas esa zona automáticamente.' },
  A:{ up:'A la vista no hace nada: solo se activa si lo atacan estando oculto.',
      down:'Si lo atacan, esa zona queda en entredicho y no la gana nadie.' }
};

function renderPlayPanel(g, card){
  const abajo = ui.orientation==='down';
  const panel = el('<div class="play-panel"></div>');

  const head = el('<div class="play-head"></div>');
  const prev = el('<div class="card play-preview '+seatClass(g,myId)+(isSpecial(card.value)?' special':'')+(abajo?' back':'')+'"></div>');
  prev.appendChild(el('<div class="cface">'+(abajo ? '<span class="val">?</span>' : cardFaceHTML(card.value))+'</div>'));
  if(!abajo && isSpecial(card.value)) prev.appendChild(el(weightBadge(card.value)));
  head.appendChild(prev);

  const info = el('<div class="play-info"></div>');
  const ori = el('<div class="ori-toggle"></div>');
  const upB = el('<button class="'+(abajo?'secondary':'')+'">A la vista</button>');
  upB.onclick = ()=>{ ui.orientation='up'; render(); };
  const dnB = el('<button class="'+(abajo?'':'secondary')+'">En secreto</button>');
  dnB.onclick = ()=>{ ui.orientation='down'; render(); };
  ori.appendChild(upB); ori.appendChild(dnB);
  info.appendChild(ori);
  const sp = SPECIAL_PLAY[String(card.value)];
  if(sp){
    const nota = el('<div class="play-effect"></div>');
    nota.appendChild(el('<span class="pe-glyph">'+CARD_GLYPH[String(card.value)]+'</span>'));
    nota.appendChild(el('<span>'+(abajo ? sp.down : sp.up)+'</span>'));
    info.appendChild(nota);
  }
  head.appendChild(info);
  panel.appendChild(head);

  panel.appendChild(el('<div class="play-hint">'+(ui.selectedZone
    ? 'Has elegido <strong>'+ZONE_LABEL[ui.selectedZone]+'</strong>. Confirma abajo o toca otra zona.'
    : 'Tu carta aparece en las cuatro zonas del tablero con lo que valdría en cada una. <strong>Toca la zona</strong> donde quieras jugarla.')+'</div>'));

  const foot = el('<div class="play-foot"></div>');
  const resumen = ui.selectedZone
    ? ('Jugar tu '+cardLabel(card.value)+' '+(abajo?'en secreto':'a la vista')+' en '+ZONE_LABEL[ui.selectedZone])
    : 'Toca una zona del tablero';
  const confirmBtn = el('<button>'+escapeHtml(resumen)+'</button>');
  confirmBtn.disabled = !ui.selectedZone;
  confirmBtn.onclick = ()=>{
    if(!ui.selectedZone) return;
    playCard(ui.selectedHandCard, ui.selectedZone, ui.orientation==='up');
  };
  foot.appendChild(confirmBtn);
  const cancelar = el('<button class="secondary">Elegir otra carta</button>');
  cancelar.onclick = ()=>{ ui.selectedHandCard=null; ui.selectedZone=null; render(); };
  foot.appendChild(cancelar);
  panel.appendChild(foot);
  return panel;
}

function renderHand(g){
  const box = el('<div class="panel stack" style="gap:10px;"></div>');
  box.appendChild(el('<h2>Tu mano</h2>'));
  if(swapMode()){
    box.appendChild(el('<p>Has jugado una <strong>J</strong>: elige en el tablero las <strong>dos cartas</strong> que quieres intercambiar. Tienen que estar en <strong>zonas distintas</strong>, y una de ellas puede ser la propia J.</p>'));
    const elegidas = ui.jSwapPicks.length;
    box.appendChild(el('<div class="small">'+(elegidas===0
      ? 'Toca la primera carta.'
      : 'Toca ahora una carta de otra zona para completar el intercambio.')+'</div>'));
    if(elegidas>0){
      const deshacer = el('<button class="secondary small-btn">Empezar de nuevo</button>');
      deshacer.onclick = ()=>{ ui.jSwapPicks=[]; render(); };
      box.appendChild(deshacer);
    }
    return box;
  }
  const hand = el('<div class="hand"></div>');
  const myHand = g.hands[myId]||[];
  const myTurn = g.phase==='jugar' && currentPlayTurnPlayer(g)===myId;
  myHand.forEach((card, idx)=>{
    const sel = ui.selectedHandCard===idx;
    const c = el('<div class="card hand-card '+seatClass(g,myId)+(isSpecial(card.value)?' special':'')
      +(sel?' selected':'')+(myTurn?' clickable':'')+handAnim(card)
      +'" style="animation-delay:'+(idx*70)+'ms"><div class="cface">'+cardFaceHTML(card.value)+'</div>'+weightBadge(card.value)+'</div>');
    if(myTurn){
      c.onclick = ()=>{ ui.selectedHandCard = sel ? null : idx; render(); };
    }
    hand.appendChild(c);
  });
  box.appendChild(hand);

  if(myTurn && ui.selectedHandCard!==null){
    const card = myHand[ui.selectedHandCard];
    box.appendChild(renderPlayPanel(g, card));
  }

  return box;
}

/* ============================= BOOT ============================= */
loadTheme().then(loadSession);
</script>
