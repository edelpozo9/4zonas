<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4 Zonas</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23191813'/%3E%3Crect x='4' y='4' width='11' height='11' rx='2' fill='%23a8792f'/%3E%3Crect x='17' y='4' width='11' height='11' rx='2' fill='%23456682'/%3E%3Crect x='4' y='17' width='11' height='11' rx='2' fill='%232f6a52'/%3E%3Crect x='17' y='17' width='11' height='11' rx='2' fill='%2375456a'/%3E%3C/svg%3E">
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap');

/* ===== TEMA ARQUITECTÓNICO =====
   Base de piedra, tinta, y un material por zona: latón, pizarra, cardenillo y
   ciruela. Reglas finas, mayúsculas espaciadas y números grandes. */
.theme-claro{
  --bg:#f2f0ea; --grid:#e4e1d7;
  --surface:#fffefb; --surface-2:#faf8f3;
  --ink:#191813; --ink-soft:#6e6a5f; --ink-faint:#a4a094;
  --line:#dcd8cc; --hair:#e8e5db;
  --bisagra:#a8792f; --umbral:#456682; --cima:#2f6a52; --foso:#75456a;
  --accent:#2f6a52; --danger:#a03a28;
  --t0:#eaf2ed; --t1:#e9eff5; --t2:#f7f0e2; --t3:#f4ecf2;
  --shadow:0 1px 0 rgba(25,24,19,.05), 0 8px 22px -14px rgba(25,24,19,.30);
  --shadow-lift:0 2px 0 rgba(25,24,19,.06), 0 16px 34px -18px rgba(25,24,19,.45);
}
.theme-oscuro{
  --bg:#141519; --grid:#1c1e23;
  --surface:#1d1f24; --surface-2:#22252b;
  --ink:#ecebe4; --ink-soft:#9b988e; --ink-faint:#6b6860;
  --line:#33363d; --hair:#2a2d33;
  --bisagra:#d0a253; --umbral:#7ea6c8; --cima:#5eb08c; --foso:#c087b3;
  --accent:#5eb08c; --danger:#e07f6b;
  --t0:#1a2620; --t1:#19222b; --t2:#272018; --t3:#251d24;
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 10px 26px -16px rgba(0,0,0,.9);
  --shadow-lift:0 2px 0 rgba(0,0,0,.5), 0 18px 40px -18px rgba(0,0,0,1);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);}
.app{
  min-height:100vh;
  background:
    linear-gradient(var(--grid) 1px, transparent 1px) 0 0/100% 34px,
    linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/34px 100%,
    var(--bg);
  color:var(--ink);
  font-family:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  font-size:15px;
  padding:20px 16px 90px;
  transition:background-color .35s ease, color .35s ease;
}
#app{max-width:1020px;margin:0 auto;}

h1,h2,h3{font-weight:600;letter-spacing:-0.015em;margin:0 0 4px;line-height:1.15;}
h1{font-size:1.5rem;}
h2{font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-soft);}
h3{font-size:.92rem;font-weight:600;margin:16px 0 6px;letter-spacing:-0.01em;}
p{color:var(--ink-soft);line-height:1.6;margin:0 0 12px;}
.small{font-size:.76rem;color:var(--ink-soft);line-height:1.5;}
.err{color:var(--danger);font-size:.82rem;line-height:1.5;}
.divider{height:1px;background:var(--hair);margin:14px 0;}

button{
  font-family:inherit;font-size:.86rem;font-weight:600;letter-spacing:.01em;
  background:var(--ink);color:var(--bg);border:1px solid var(--ink);border-radius:3px;
  padding:10px 17px;cursor:pointer;
  transition:transform .1s ease, box-shadow .18s ease, background-color .18s ease, opacity .18s ease;
}
button:hover:not(:disabled){transform:translateY(-1px);box-shadow:var(--shadow);}
button:active:not(:disabled){transform:translateY(1px);box-shadow:none;}
button.secondary{background:transparent;color:var(--ink);border-color:var(--line);}
button.secondary:hover:not(:disabled){border-color:var(--ink);}
button.danger{background:var(--danger);border-color:var(--danger);color:#fff;}
button:disabled{opacity:.32;cursor:not-allowed;}
.small-btn{padding:6px 12px;font-size:.76rem;}
.theme-btn{
  float:right;background:transparent;color:var(--ink-soft);border-color:var(--hair);
  padding:5px 11px;font-size:.72rem;
}

input{
  font-family:inherit;font-size:.92rem;padding:10px 12px;border-radius:3px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%;
  transition:border-color .18s ease;
}
input:focus{outline:none;border-color:var(--ink);}
label{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-faint);display:block;margin-bottom:5px;}

.stack{display:flex;flex-direction:column;gap:11px;}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center;}
.panel{
  background:var(--surface);border:1px solid var(--line);border-radius:4px;
  padding:17px 18px;box-shadow:var(--shadow);
}
.center-box{max-width:400px;margin:56px auto;}
.pill,.tag{
  display:inline-block;font-size:.62rem;font-weight:700;padding:2px 8px;border-radius:20px;
  background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--hair);
  text-transform:uppercase;letter-spacing:.07em;white-space:nowrap;
}
.tag.eclipse{background:transparent;color:var(--foso);border-color:var(--foso);}
.tag.coronacion{background:transparent;color:var(--bisagra);border-color:var(--bisagra);}
.tag.done{background:transparent;color:var(--cima);border-color:var(--cima);}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:1.5rem;letter-spacing:.22em;font-weight:700;}

/* ===== PORTADA ===== */
.hero{padding:26px 2px 6px;}
.hero-title{
  font-size:clamp(2.4rem,7vw,3.6rem);font-weight:700;letter-spacing:-0.045em;
  margin-bottom:10px;line-height:.95;
}
.hero-title::after{
  content:'';display:block;width:64px;height:3px;background:var(--ink);margin-top:16px;
  animation:drawRule .7s cubic-bezier(.2,.8,.2,1) both;
}
.hero-sub{font-size:1rem;max-width:54ch;line-height:1.6;margin-top:14px;}

/* ===== MARCADOR ===== */
.topbar{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:14px;margin-bottom:18px;}
.scoreboard{display:flex;gap:9px;flex-wrap:wrap;}
.score-chip{
  position:relative;background:var(--surface);border:1px solid var(--line);border-radius:4px;
  padding:10px 13px 11px;min-width:140px;flex:1 1 140px;max-width:220px;
  box-shadow:var(--shadow);
  transition:box-shadow .3s ease, border-color .3s ease, transform .3s ease;
}
.score-chip::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--seat,var(--line));}
.score-chip.turn{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow-lift);}
.score-chip.turn::after{
  content:'';position:absolute;inset:-3px;border:1px solid var(--accent);border-radius:6px;
  animation:pulseRing 2.2s ease-in-out infinite;pointer-events:none;
}
.chip-head{display:flex;align-items:center;gap:6px;margin-bottom:9px;}
.seat-mark{font-size:.8rem;color:var(--seat,var(--ink));}
.chip-name{font-weight:700;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.chip-you{font-size:.58rem;font-weight:700;background:var(--ink);color:var(--bg);padding:2px 6px;border-radius:20px;letter-spacing:.06em;}
.chip-adv{font-size:.85rem;color:var(--bisagra);margin-left:auto;}
.chip-stats{display:flex;gap:18px;align-items:flex-end;}
.stat{position:relative;display:flex;flex-direction:column;line-height:1;}
.stat-num{font-size:1.6rem;font-weight:700;letter-spacing:-0.04em;font-variant-numeric:tabular-nums;}
.stat-lbl{font-size:.55rem;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.11em;margin-top:5px;}
.chip-state{font-size:.68rem;color:var(--ink-soft);margin-top:9px;}
.chip-cards{font-size:.63rem;color:var(--ink-faint);margin-top:2px;}
.chip-turn{
  position:absolute;top:-9px;right:10px;font-size:.55rem;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;background:var(--accent);color:#fff;padding:3px 8px;border-radius:20px;
}

/* ===== ZONAS ===== */
.zones-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px;margin:18px 0;}
@media (max-width:760px){.zones-grid{grid-template-columns:1fr;}}
.zone{
  position:relative;overflow:hidden;
  background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:15px 16px;
  box-shadow:var(--shadow);
  transition:box-shadow .3s ease, border-color .3s ease;
}
.zone::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--zc,var(--ink));}
.zone.bisagra{--zc:var(--bisagra);}
.zone.umbral{--zc:var(--umbral);}
.zone.cima{--zc:var(--cima);}
.zone.foso{--zc:var(--foso);}
.zone.resolving{border-color:var(--zc,var(--ink));animation:zonePulse 1.5s ease-in-out infinite;}
.zone.resolving::before{height:4px;animation:barPulse 1.5s ease-in-out infinite;}
.zone.resolved{
  background:
    repeating-linear-gradient(135deg, var(--grid) 0 2px, transparent 2px 11px),
    var(--surface);
}
.zone.resolved::before{opacity:.4;}
.zone.resolved .zone-title h2{opacity:.65;}
.zone-head{margin-bottom:13px;}
.zone-title{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.zone-title h2{font-size:.82rem;letter-spacing:.16em;color:var(--zc,var(--ink));}
.zone-head .cond{display:block;font-size:.71rem;color:var(--ink-soft);margin-top:6px;line-height:1.5;padding-top:6px;border-top:1px solid var(--hair);}
.zone-status{font-size:.68rem;color:var(--ink-soft);margin-top:8px;letter-spacing:.05em;}
.empty-zone{font-size:.73rem;color:var(--ink-faint);padding:16px 0;letter-spacing:.04em;}
.zone-groups{display:flex;flex-direction:row;flex-wrap:wrap;align-items:flex-start;gap:9px;}
.owner-group{border-left:2px solid var(--seat,var(--line));padding-left:8px;min-width:0;}
.owner-label{font-size:.66rem;font-weight:700;display:flex;align-items:center;gap:5px;margin-bottom:6px;white-space:nowrap;color:var(--seat,var(--ink));text-transform:uppercase;letter-spacing:.06em;}
.owner-label .sum{margin-left:6px;font-size:.72rem;padding:1px 8px;border-radius:20px;background:var(--surface-2);border:1px solid var(--hair);color:var(--ink);font-variant-numeric:tabular-nums;}
.owner-label .sum.bust{color:var(--danger);border-color:var(--danger);}
.zone-cards{display:flex;flex-wrap:wrap;gap:5px;}
.sweep{position:absolute;top:0;bottom:0;width:38%;pointer-events:none;
  background:linear-gradient(90deg,transparent,var(--zc),transparent);opacity:.14;
  animation:sweepAcross 1.6s ease-in-out infinite;}

/* ===== IDENTIDAD DE JUGADOR ===== */
.p0{--seat:var(--cima);--tint:var(--t0);}
.p1{--seat:var(--umbral);--tint:var(--t1);}
.p2{--seat:var(--bisagra);--tint:var(--t2);}
.p3{--seat:var(--foso);--tint:var(--t3);}

/* ===== CARTAS ===== */
.card{
  position:relative;width:52px;height:70px;border-radius:3px;
  border:1px solid var(--line);border-bottom:3px solid var(--seat,var(--line));
  background:var(--surface);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-weight:700;font-size:1.1rem;user-select:none;
  transition:transform .18s cubic-bezier(.2,.8,.2,1), box-shadow .18s ease, opacity .3s ease;
  font-variant-numeric:tabular-nums;
}
.card .val{line-height:1;}
.card.back{
  color:var(--ink-faint);
  background:repeating-linear-gradient(45deg,var(--surface-2),var(--surface-2) 3px,var(--hair) 3px,var(--hair) 6px);
}
.card.mine{border-color:var(--ink);}
  /* Se jugó oculta: conserva de fondo la trama del dorso */
  .card.was-hidden{
    background-image:repeating-linear-gradient(45deg,rgba(125,120,105,.16) 0 2px,transparent 2px 7px);
  }
.card.marked{border-left:3px solid var(--danger);}
.card.selected,.card.picked{box-shadow:inset 0 0 0 2px var(--accent);}
.card.focus{box-shadow:0 0 0 3px var(--ink);animation:focusPulse 1.4s ease-in-out infinite;}
.card.clickable{cursor:pointer;}
.card.clickable:hover{transform:translateY(-4px) rotate(-1deg);box-shadow:var(--shadow-lift);}
.card.dead{opacity:.42;}
.card .calc{font-size:.58rem;font-weight:600;color:var(--ink-soft);margin-top:3px;letter-spacing:.02em;}
.card .badge{position:absolute;top:3px;right:4px;font-size:.56rem;line-height:1;}
.card .badge.atk{color:var(--danger);}
.card .badge.act{color:var(--bisagra);right:auto;left:4px;}
.card .dead-note{position:absolute;bottom:2px;left:0;right:0;font-size:.5rem;font-weight:700;color:var(--danger);text-align:center;overflow:hidden;white-space:nowrap;padding:0 2px;}
  .card.dead{opacity:.5;transform:rotate(-7deg) translateY(5px);filter:grayscale(.5);}
  .card.dead .cface{text-decoration:line-through;}
  .card.dead:hover{transform:rotate(-7deg) translateY(5px);}
.hand{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px;}
.hand .card{width:58px;height:79px;cursor:pointer;}

/* ===== RESULTADO DE ZONA ===== */
.zone-result{margin-top:12px;padding-top:11px;border-top:1px solid var(--hair);}
.res-win{display:flex;align-items:center;gap:7px;font-size:.9rem;color:var(--seat,var(--ink));flex-wrap:wrap;}
.res-mark{font-size:.95rem;}
.res-gain{font-size:.7rem;font-weight:600;color:var(--ink-soft);letter-spacing:.02em;}
.res-none{font-size:.86rem;font-weight:600;color:var(--ink-faint);letter-spacing:.03em;}
.res-why{font-size:.73rem;color:var(--ink-soft);line-height:1.5;margin-top:5px;}
.res-adv{font-size:.71rem;font-weight:700;color:var(--bisagra);margin-top:5px;letter-spacing:.03em;}

/* ===== BANNERS Y PANELES ===== */
.banner{background:var(--surface-2);border:1px solid var(--hair);border-radius:3px;padding:11px 14px;font-size:.85rem;line-height:1.5;}
.banner.action{background:transparent;border-color:var(--accent);border-left-width:3px;}
.modal-inline{background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--ink);border-radius:3px;padding:13px 15px;margin-top:11px;}
.choice-row{border:1px solid var(--line);border-radius:3px;padding:10px;margin-top:9px;background:var(--surface);}
.stall{border:1px solid var(--bisagra);border-left-width:3px;background:var(--surface);border-radius:3px;padding:13px 15px;margin-bottom:15px;}
.stall-head{font-weight:700;font-size:.86rem;color:var(--bisagra);letter-spacing:.02em;}
.stall-body{font-size:.83rem;margin-top:4px;line-height:1.5;}

/* ===== LISTAS ===== */
.players-list{list-style:none;padding:0;margin:0;}
.players-list li{padding:9px 0;border-bottom:1px solid var(--hair);font-size:.88rem;display:flex;align-items:center;gap:6px;}
.players-list li:last-child{border-bottom:none;}
.players-list li .pill{margin-left:6px;}
.rank-score{margin-left:auto;font-size:1.05rem;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:2px;}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;}
.dot.on{background:var(--accent);}
.dot.off{background:transparent;border:1px solid var(--ink-faint);}
.room-list{display:flex;flex-direction:column;gap:8px;}
.room-row{display:flex;justify-content:space-between;align-items:center;gap:11px;border:1px solid var(--line);border-radius:3px;padding:11px 13px;background:var(--surface-2);transition:border-color .2s ease;}
.room-row:hover{border-color:var(--ink);}
.room-code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700;font-size:1.1rem;letter-spacing:.16em;}

/* ===== AYUDA ===== */
.help-list{margin:0;padding-left:20px;font-size:.85rem;line-height:1.7;color:var(--ink-soft);}
.help-list strong{color:var(--ink);}
.help-cards{display:flex;flex-direction:column;gap:9px;}
.help-card{display:flex;gap:13px;align-items:flex-start;border:1px solid var(--line);border-radius:3px;padding:11px 13px;background:var(--surface-2);}
.help-card-face{
  flex:0 0 40px;height:54px;border:1px solid var(--line);border-bottom:3px solid var(--ink);border-radius:3px;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.25rem;background:var(--surface);
}
.help-when{font-size:.62rem;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.09em;}
.help-eff{font-size:.85rem;line-height:1.55;margin-top:4px;}
.help-alt{margin-top:6px;padding-top:6px;border-top:1px solid var(--hair);}
.help-zones{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;}
@media (max-width:640px){.help-zones{grid-template-columns:1fr;}}
.help-zone{position:relative;border:1px solid var(--line);border-radius:3px;padding:11px 13px;background:var(--surface-2);}
.help-zone::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--zc,var(--ink));}
.help-zone.bisagra{--zc:var(--bisagra);} .help-zone.umbral{--zc:var(--umbral);}
.help-zone.cima{--zc:var(--cima);} .help-zone.foso{--zc:var(--foso);}
.help-zone-name{font-weight:700;font-size:.76rem;text-transform:uppercase;letter-spacing:.12em;color:var(--zc,var(--ink));}
.help-zone-cond{font-size:.76rem;color:var(--ink-soft);line-height:1.5;margin-top:5px;}
.help-zone-prize{font-size:.71rem;font-weight:600;margin-top:7px;}
.help-panel{border-color:var(--ink);}

/* ===== ESTADÍSTICAS ===== */
.stat-table{display:flex;flex-direction:column;gap:11px;}
.stat-row{display:grid;grid-template-columns:78px 1fr;gap:5px 11px;align-items:center;}
.stat-row-name{font-weight:700;font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;}
.stat-row-val{grid-column:2;font-size:.71rem;color:var(--ink-soft);}
.bar{height:7px;background:var(--surface-2);border:1px solid var(--hair);border-radius:20px;overflow:hidden;}
.bar-fill{height:100%;background:var(--ink);}
.bar-fill.bisagra{background:var(--bisagra);} .bar-fill.umbral{background:var(--umbral);}
.bar-fill.cima{background:var(--cima);} .bar-fill.foso{background:var(--foso);}
.match-row{border-bottom:1px solid var(--hair);padding:9px 0;font-size:.85rem;}
.match-row:last-of-type{border-bottom:none;}

/* ===== REGISTRO ===== */
.log{max-height:200px;overflow-y:auto;padding-right:5px;}
.log-line{display:flex;gap:9px;font-size:.78rem;line-height:1.55;padding:4px 0;color:var(--ink-soft);border-bottom:1px solid var(--hair);}
.log-line:last-child{border-bottom:none;}
.log-line strong{color:var(--ink);font-weight:600;}
.log-icon{flex:0 0 14px;text-align:center;color:var(--ink-faint);font-size:.8rem;}
.log-line.k-ronda{color:var(--ink);font-weight:600;margin-top:7px;text-transform:uppercase;letter-spacing:.06em;font-size:.72rem;}
.log-line.k-ronda .log-icon{color:var(--ink);}
.log-line.k-ataque .log-icon{color:var(--danger);}
.log-line.k-activar .log-icon{color:var(--bisagra);}
.log-line.k-cambio .log-icon{color:var(--umbral);}
.log-line.k-purga .log-icon{color:var(--foso);}
.log-line.k-zona .log-icon{color:var(--cima);}
.log-line.k-fin{color:var(--ink);font-weight:700;}

/* ===== FINAL DE PARTIDA ===== */
.finale{position:relative;overflow:hidden;}
.finale.anim-finale{animation:finaleIn .6s cubic-bezier(.2,.9,.2,1) both;}
.finale.anim-finale::after{
  content:'';position:absolute;top:0;bottom:0;width:45%;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.16;
  animation:sweepAcross 1.5s ease-out .25s both;pointer-events:none;
}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.confetti i{position:absolute;top:-14px;width:6px;height:11px;opacity:0;animation:fall 2.6s cubic-bezier(.3,.6,.5,1) both;}
.confetti .c0{background:var(--bisagra);} .confetti .c1{background:var(--umbral);}
.confetti .c2{background:var(--cima);} .confetti .c3{background:var(--foso);}
.float-gain{
  position:absolute;top:-4px;left:100%;margin-left:5px;font-size:.8rem;font-weight:700;color:var(--accent);
  animation:floatUp 1.5s ease-out both;pointer-events:none;white-space:nowrap;
}

/* ===== AMBIENTACIÓN: LA CIUDAD VERTICAL ===== */
.hero-grid{display:flex;gap:26px;align-items:center;}
@media (max-width:640px){.hero-grid{gap:14px;}}
.hero-kicker{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.22em;color:var(--ink-faint);margin-bottom:9px;}

<script>
/* ============================= CONFIGURACIÓN DE FIREBASE =============================
   PEGA AQUÍ el objeto de configuración de tu proyecto de Firebase (Configuración del
   proyecto → Tus apps → SDK de Firebase). Debe incluir "databaseURL". */
const firebaseConfig = {
  apiKey: "AIzaSyCCHr7fUJK7ziNZzACHvQbItJVwiYGkr4k",
  authDomain: "zonas-4.firebaseapp.com",
  databaseURL: "https://zonas-4-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "zonas-4",
  storageBucket: "zonas-4.firebasestorage.app",
  messagingSenderId: "605071632175",
  appId: "1:605071632175:web:489ff74fc1be8ad3fde3da",
  measurementId: "G-8V5R6MFMHN"
};

firebase.initializeApp(firebaseConfig);
const fbDb = firebase.database();

/* ============================= SHIM window.storage =============================
   Reimplementa exactamente la misma interfaz que usaba el Artifact de Claude
   (get/set/delete/list con clave + flag "shared"), para que el resto del código
   del juego no necesite ningún otro cambio.
   - shared=false (preferencias/sesión de ESTE navegador) -> localStorage
   - shared=true  (partida, presencia, listado de salas)  -> Firebase Realtime Database */
function fbPath(key){ return 'store/' + key; }

window.storage = {
  async get(key, shared){
    if(!shared){
      try{
        const raw = localStorage.getItem('4zonas:'+key);
        return raw===null ? null : { key, value: raw, shared:false };
      }catch(e){ return null; }
    }
    const snap = await fbDb.ref(fbPath(key)).once('value');
    const v = snap.val();
    return (v===null || v===undefined) ? null : { key, value:v, shared:true };
  },
  async set(key, value, shared){
    if(!shared){
      localStorage.setItem('4zonas:'+key, value);
      return { key, value, shared:false };
    }
    await fbDb.ref(fbPath(key)).set(value);
    return { key, value, shared:true };
  },
  async delete(key, shared){
    if(!shared){
      try{ localStorage.removeItem('4zonas:'+key); }catch(e){}
      return { key, deleted:true, shared:false };
    }
    await fbDb.ref(fbPath(key)).remove();
    return { key, deleted:true, shared:true };
  },
  async list(prefix, shared){
    prefix = prefix || '';
    if(!shared){
      const keys = [];
      try{
        for(let i=0;i<localStorage.length;i++){
          const k = localStorage.key(i);
          if(k && k.indexOf('4zonas:'+prefix)===0) keys.push(k.slice(7));
        }
      }catch(e){}
      return { keys, prefix, shared:false };
    }
    const snap = await fbDb.ref('store').orderByKey().startAt(prefix).endAt(prefix+'\uf8ff').once('value');
    const keys = [];
    snap.forEach(child=>{ keys.push(child.key); });
    return { keys, prefix, shared:true };
  }
};
</script>

const PLAYER_MARKS = ['●','■','▲','◆'];

/* Cada jugador tiene un color y un símbolo fijos según su asiento, para poder
   seguir de un vistazo qué cartas son de quién. */
function seatOf(g, playerId){
  const i = g.players.findIndex(p=>p.id===playerId);
  return i<0 ? 0 : i;
}
function markOf(g, playerId){ return PLAYER_MARKS[seatOf(g,playerId) % PLAYER_MARKS.length]; }
function seatClass(g, playerId){ return 'p'+(seatOf(g,playerId) % 4); }

/* ---- Registro con iconos y énfasis ----
   Cada línea es {i: icono, t: texto}. En el texto, *lo que va entre asteriscos*
   se muestra en negrita. */
const LOG_ICON = {
  jugar:'▸', ataque:'⚔', activar:'★', cambio:'⇄', purga:'✖',
  zona:'◈', ronda:'❯', sala:'·', fin:'✦', umbral:'±',
};
function addLog(g, kind, text){
  g.log = g.log || [];
  g.log.push({i: LOG_ICON[kind] || '·', t: text, k: kind});
  if(g.log.length>200) g.log = g.log.slice(-200);
}
function formatLogText(t){
  const parts = String(t).split('*');
  return parts.map((p,i)=> i%2===1 ? '<strong>'+escapeHtml(p)+'</strong>' : escapeHtml(p)).join('');
}

/* ===================== SEGUIMIENTO PARA ANIMACIONES =====================
   Guardamos cómo estaba cada carta en el repintado anterior para animar solo
   lo que acaba de cambiar, en vez de animarlo todo en cada repintado. */
let prevCards = {};
let nextCards = {};
let prevHand = {};
let nextHand = {};
let prevPrestige = {};
let prevRound = 0;
let prevEnded = false;

let prevFlags = {};
let nextFlags = {};
/* Devuelve la clase de animación si la marca de esta zona acaba de aparecer. */
function zoneFlagAnim(g, zk){
  const fl = (g.zoneFlags && g.zoneFlags[zk]) || {};
  const firma = (fl.eclipse?'A':'')+((fl.coronation||[]).length)+((fl.eclipseBy||[]).length);
  const antes = prevFlags[zk];
  nextFlags[zk] = firma;
  return (antes!==undefined && antes!==firma) ? ' tag-new' : '';
}

function cardState(entry, zk){
  return zk+'|'+(entry.faceUp?'1':'0')+'|'+(entry.discarded?'1':'0')+'|'+(entry.attackedOnce?'1':'0')+'|'+(entry.activated?'1':'0');
}
/* Devuelve la clase de animación que le toca a esta carta ahora mismo. */
function cardAnim(entry, zk){
  const id = entry.card.id;
  const ahora = cardState(entry, zk);
  const antes = prevCards[id];
  nextCards[id] = ahora;
  if(antes === undefined) return ' anim-deal';
  if(antes === ahora) return '';
  const [azk, aface, adead, aatk] = antes.split('|');
  if(adead==='0' && entry.discarded){
    return entry.discardedBy==='Q' ? ' anim-purge' : ' anim-fall';
  }
  if(aface==='0' && entry.faceUp) return entry.activated ? ' anim-awaken' : ' anim-flip';
  if(aatk==='0' && entry.attackedOnce) return ' anim-hit';
  if(azk !== zk) return ' anim-swap';
  return '';
}
function handAnim(card){
  const id = card.id;
  const nuevo = prevHand[id]===undefined;
  nextHand[id] = 1;
  return nuevo ? ' anim-deal' : '';
}


/* ============================================================
   ADVERSARIO AUTOMÁTICO
   No juega al azar: lleva la cuenta de las cartas que ya han
   salido, estima el valor de lo que sigue oculto, y puntúa cada
   jugada posible por lo que espera ganar menos lo que arriesga.
   ============================================================ */
const BOT_NAMES = ['Plomada','Dintel','Cornisa','Contrafuerte'];
const ZONE_WORTH = {bisagra:1.9, umbral:3, cima:2, foso:2}; // Bisagra vale más de lo que da: ficha + desempate

function isBot(g, id){ const p=g.players.find(x=>x.id===id); return !!(p && p.bot); }

/* Cartas que un jugador todavía puede tener sin que nadie las haya visto. */
function unseenOf(g, pid){
  const rest = CARD_VALUES.slice();
  const quitar = (v)=>{ const i=rest.indexOf(v); if(i>-1) rest.splice(i,1); };
  (g.discard[pid]||[]).forEach(c=>quitar(c.value));
  ZONE_KEYS.forEach(zk=> g.zones[zk].forEach(e=>{
    if(e.card.owner===pid && e.faceUp) quitar(e.card.value);
  }));
  return rest;
}
/* Valor medio esperado de una carta suya que siga oculta. */
function expectedHidden(g, pid){
  const r = unseenOf(g, pid).map(baseValue);
  return r.length ? r.reduce((a,b)=>a+b,0)/r.length : 5.3;
}
function probEsValor(g, pid, valores){
  const r = unseenOf(g, pid);
  if(!r.length) return 0;
  return r.filter(v=>valores.indexOf(v)>-1).length / r.length;
}
/* Valor con el que competiría una carta en una zona. */
function estVal(zk, base, oculta, umbralPref){
  if(!oculta) return base;
  if(zk==='cima') return base+2;
  if(zk==='foso') return base-2;
  if(zk==='umbral') return base + (umbralPref===undefined ? 0 : umbralPref);
  return base;
}
/* Lo que se estima que vale ahora mismo cada carta viva de una zona. */
/* perspectiva = quién está mirando el tablero (solo conoce SUS ocultas).
   Permite estimar también las opciones de un rival sin hacer trampas. */
function zoneEstimates(g, zk, perspectiva){
  return liveCards(g, zk).map(e=>{
    const conocida = e.faceUp || (perspectiva && e.card.owner===perspectiva);
    return {
      owner: e.card.owner,
      oculta: !!e.originalFaceDown && !e.faceUp,
      val: conocida ? finalValue(zk, e) : estVal(zk, expectedHidden(g, e.card.owner), true)
    };
  });
}

/* ¿Qué posibilidades tiene el bot de llevarse esta zona tal y como está? */
function zoneOutlook(g, zk, sujeto, perspectiva){
  const est = zoneEstimates(g, zk, perspectiva===undefined ? sujeto : perspectiva);
  const mias = est.filter(e=>e.owner===sujeto);
  const ajenas = est.filter(e=>e.owner!==sujeto);
  const flags = (g.zoneFlags && g.zoneFlags[zk]) || {};
  if(flags.eclipse) return {muerta:true, mio:0, rival:0};
  if(flags.coronation && flags.coronation.length){
    return {muerta: flags.coronation.indexOf(sujeto)<0, mio:0, rival:0};
  }
  if(zk==='umbral'){
    const suma = arr => arr.reduce((a,b)=>a+b.val,0);
    const mio = suma(mias);
    const porRival = {};
    ajenas.forEach(e=>{ porRival[e.owner]=(porRival[e.owner]||0)+e.val; });
    const rivales = Object.keys(porRival).map(k=>porRival[k]).filter(v=>v<=11);
    return {muerta:false, mio: mio<=11?mio:-99, rival: rivales.length?Math.max(...rivales):0};
  }
  if(zk==='foso'){
    return {muerta:false,
      mio: mias.length ? Math.min(...mias.map(e=>e.val)) : 99,
      rival: ajenas.length ? Math.min(...ajenas.map(e=>e.val)) : 99};
  }
  // cima y bisagra se miden por la carta más alta
  return {muerta:false,
    mio: mias.length ? Math.max(...mias.map(e=>e.val)) : -99,
    rival: ajenas.length ? Math.max(...ajenas.map(e=>e.val)) : -99};
}

/* Cuántas cartas les quedan por colocar a los rivales en esta ronda. */
function jugadasPendientesRivales(g, sujeto){
  const q = quotaThisRound(g);
  let n = 0;
  g.players.forEach(p=>{
    if(p.id===sujeto) return;
    n += Math.max(0, q - (g.playedThisRound[p.id]||0));
  });
  return n;
}

/* Una zona vacía no está ganada: los rivales todavía tienen cartas que poner.
   Esto estima contra qué se va a acabar midiendo uno al final de la ronda. */
function amenazaFutura(g, zk, sujeto){
  // Solo tiene sentido mientras se están colocando cartas: en la fase de
  // ataque o en la resolución ya no va a entrar nada nuevo.
  if(g.phase && g.phase!=='jugar') return null;
  const n = jugadasPendientesRivales(g, sujeto);
  if(n<=0) return null;
  const k = Math.min(n, 5);
  if(zk==='cima')   return 5.4 + k*0.6;    // colocarán lo más alto que tengan
  if(zk==='foso')   return 5.4 - k*0.6;    // o lo más bajo
  if(zk==='umbral') return Math.min(11, 4.5 + k*1.5);
  return null;
}

/* Probabilidad aproximada de que el bot se lleve la zona en su estado actual. */
function zoneWinProb(g, zk, sujeto, perspectiva){
  const persp = perspectiva===undefined ? sujeto : perspectiva;
  const flags = (g.zoneFlags && g.zoneFlags[zk]) || {};
  if(flags.eclipse) return 0;
  const cor = [...new Set(flags.coronation || [])];
  if(cor.length===1) return cor[0]===sujeto ? 1 : 0;
  if(cor.length>1 && g.bisagraAdvantage && cor.indexOf(g.bisagraAdvantage)>-1){
    return g.bisagraAdvantage===sujeto ? 1 : 0;
  }
  // La Bisagra no va de "la más alta": va de la paridad de la suma.
  if(zk==='bisagra'){
    const vivas = liveCards(g,'bisagra');
    if(vivas.length===0) return 0;
    const valor = e => (e.faceUp || e.card.owner===persp)
      ? finalValue('bisagra', e) : expectedHidden(g, e.card.owner);
    if(vivas.length===1){
      const mia = vivas[0].card.owner===sujeto;
      // Si a los rivales les quedan cartas, la completarán y todo dependerá
      // de la paridad: prácticamente una moneda al aire.
      if(jugadasPendientesRivales(g, sujeto)<=0) return mia ? 1 : 0;
      return mia ? 0.55 : 0.42;
    }
    const [a,b] = vivas;
    if(a.card.owner===b.card.owner) return a.card.owner===sujeto ? 0.95 : 0;
    const va = valor(a), vb = valor(b);
    if(va===vb) return 0;
    const par = ((va+vb)%2)===0;
    const gana = par ? (va>vb?a:b) : (va<vb?a:b);
    const seguro = (a.faceUp || a.card.owner===persp) && (b.faceUp || b.card.owner===persp);
    if(!seguro) return gana.card.owner===sujeto ? 0.55 : 0.45;
    return gana.card.owner===sujeto ? 1 : 0;
  }
  const o = zoneOutlook(g, zk, sujeto, persp);
  const futura = amenazaFutura(g, zk, sujeto);
  if(zk==='umbral'){
    if(o.mio<=0) return 0;
    const rival = futura===null ? (o.rival||0) : Math.max(o.rival||0, futura);
    // Acercarse a 11 importa tanto como superar al rival
    const cercania = Math.max(0.35, 1 - (11-o.mio)*0.12);
    return ventajaAProb(o.mio - rival) * cercania;
  }
  if(zk==='foso'){
    if(o.mio>90) return 0;
    const rival = futura===null ? o.rival : Math.min(o.rival, futura);
    return ventajaAProb(rival - o.mio);
  }
  if(o.mio<-90) return 0;
  const rival = futura===null ? o.rival : Math.max(o.rival, futura);
  return ventajaAProb(o.mio - rival);
}

/* Cómo de bien está el tablero para el bot: suma lo que puede llevarse y resta
   lo que tienen encarrilado los rivales. Esto es lo que permite que la J sirva
   también para descolocar al contrario, no solo para colocarse uno. */
function posicionGlobal(g, botId){
  let total = 0;
  ZONE_KEYS.forEach(zk=>{
    const w = ZONE_WORTH[zk];
    const mia = zoneWinProb(g, zk, botId, botId);
    let rival = 0;
    g.players.forEach(p=>{
      if(p.id===botId) return;
      rival = Math.max(rival, zoneWinProb(g, zk, p.id, botId));
    });
    total += w * (mia - 0.65*rival);
  });
  return total;
}

/* Coloca una carta de mentira para ver cómo quedaría la zona. */
function simulaCarta(g, botId, value, zk, oculta, umbralPref, fn){
  const entry = {card:{id:'__sim', owner:botId, value}, faceUp:!oculta,
                 originalFaceDown:oculta, revealed:!oculta,
                 attackedOnce:false, activated:false,
                 umbralChoice: (oculta && zk==='umbral') ? umbralPref : null};
  g.zones[zk].push(entry);
  const r = fn();
  g.zones[zk].pop();
  return r;
}

/* Traduce una ventaja numérica en una probabilidad aproximada de ganar la zona. */
function ventajaAProb(margen){
  return 1 / (1 + Math.exp(-margen/1.8));
}

/* Cómo quedaría la Bisagra si el bot pone esta carta. Aquí no hay que estimar:
   la paridad es exacta cuando la otra carta está a la vista. */
function bisagraScore(g, botId, base){
  const vivas = liveCards(g,'bisagra');
  if(vivas.length===0) return 0.45;              // abrir es apuesta a ciegas
  if(vivas.length>=2) return -99;                 // no cabe
  const otra = vivas[0];
  if(otra.card.owner===botId) return 0.9;         // completarla propia: se la lleva
  const v = otra.faceUp ? finalValue('bisagra', otra) : expectedHidden(g, otra.card.owner);
  if(!otra.faceUp){
    // A ciegas: la mitad de las veces la paridad nos favorece
    return 0.5;
  }
  if(v===base) return 0;                          // empate: nadie gana
  const par = ((v+base)%2)===0;
  const gano = par ? (base>v) : (base<v);
  return gano ? 1 : 0;
}

/* Diferencia de Prestigio entre el bot y el mejor rival. Negativo = va por detrás. */
function ventajaPrestigio(g, botId){
  let mejorRival = -Infinity;
  g.players.forEach(p=>{ if(p.id!==botId) mejorRival = Math.max(mejorRival, g.prestige[p.id]||0); });
  if(mejorRival===-Infinity) return 0;
  return (g.prestige[botId]||0) - mejorRival;
}
/* Multiplicador de cautela a partir de esa diferencia: >1 = juega más sobre
   seguro (va ganando, no quiere arriesgar la ventaja), <1 = se permite más
   riesgo (va perdiendo, un juego "seguro" no le va a remontar la partida). */
function cautela(g, botId){
  const dif = ventajaPrestigio(g, botId);
  return Math.max(0.55, Math.min(1.5, 1 + dif*0.06));
}

/* Cuánto podría mejorar el bot su opción de ganar esta zona SI, más adelante en
   la misma ronda, usa una de sus fichas de ataque libres para descartar la
   carta rival que más le estorba aquí. No es una búsqueda completa (no reparte
   fichas entre varias zonas a la vez), pero evita el error de descartar una
   zona como "perdida" solo porque ahora mismo hay una carta rival fuerte. */
function potencialAtaqueEnZona(g, botId, zk){
  const fichas = g.tokens[botId]||0;
  if(fichas<=0) return 0;
  const flags = (g.zoneFlags && g.zoneFlags[zk]) || {};
  if(flags.eclipse) return 0;
  const rivales = liveCards(g, zk).filter(e=>e.card.owner!==botId);
  if(!rivales.length) return 0;

  const antes = zoneWinProb(g, zk, botId);
  let mejorGanancia = 0;
  rivales.forEach(e=>{
    // Coste en fichas de quitarla: 1 si está oculta (revela y cae), 2 si está a
    // la vista y aún no marcada, 1 si ya tiene un golpe encima.
    const coste = e.faceUp ? (e.attackedOnce ? 1 : 2) : 1;
    if(coste > fichas) return;
    e.discarded = true;
    const conEsta = zoneWinProb(g, zk, botId);
    e.discarded = false;
    let ganancia = Math.max(0, conEsta - antes);
    if(!e.faceUp){
      // Si está oculta podría ser K o As: atacarla no garantiza nada, y en el
      // peor de los casos le regala la zona al rival.
      const pK = probEsValor(g, e.card.owner, ['K']);
      const pA = probEsValor(g, e.card.owner, ['A']);
      ganancia *= Math.max(0, 1 - pK - pA);
    }
    if(ganancia > mejorGanancia) mejorGanancia = ganancia;
  });
  // Es un plan, no una jugada segura: se descuenta porque compite con otros
  // usos posibles de esas mismas fichas más adelante en la ronda.
  return mejorGanancia * 0.55;
}

/* Puntúa jugar una carta concreta en una zona, a la vista o en secreto. */
function scorePlay(g, botId, card, zk, oculta){
  const base = baseValue(card.value);
  const val = card.value;
  const flags = (g.zoneFlags && g.zoneFlags[zk]) || {};
  if(zk==='bisagra' && liveCards(g,'bisagra').length>=2) return -99;

  let score = 0;
  const worth = ZONE_WORTH[zk];
  let despuesOculta = null; // valor de ganar la zona si esta carta se juega oculta (para el tope de riesgo, más abajo)

  // --- Lo que APORTA la jugada: cuánto sube mi opción de llevarme la zona ---
  if(flags.eclipse){
    score -= 1.5;                                  // zona muerta: no malgastes nada
  } else {
    const antes = zoneWinProb(g, zk, botId);
    let despues;
    if(oculta && zk==='umbral'){
      // en Umbral el modificador lo elige él, así que cuenta el mejor de los dos
      despues = Math.max(
        simulaCarta(g, botId, val, zk, true,  1, ()=>zoneWinProb(g, zk, botId)),
        simulaCarta(g, botId, val, zk, true, -1, ()=>zoneWinProb(g, zk, botId))
      );
    } else {
      despues = simulaCarta(g, botId, val, zk, oculta, 0, ()=>zoneWinProb(g, zk, botId));
    }
    if(oculta) despuesOculta = despues;
    score += (despues - antes) * worth;

    // No descartes una zona solo porque ahora mismo la va ganando un rival:
    // si aún tienes fichas, cuenta también lo que podrías arreglar atacando.
    score += potencialAtaqueEnZona(g, botId, zk) * worth;

    // Empate consigo mismo: dos cartas propias del mismo valor se anulan
    if(zk==='cima' || zk==='foso'){
      const miVal = estVal(zk, base, oculta);
      const choque = liveCards(g, zk).some(e=>e.card.owner===botId &&
        (e.faceUp ? finalValue(zk,e) : estVal(zk, expectedHidden(g,botId), true)) === miVal);
      if(choque) score -= 1.1;
    }
    // Amontonar cartas donde ya mando no sirve de nada
    const propias = liveCards(g, zk).filter(e=>e.card.owner===botId).length;
    if(propias>0 && zk!=='umbral' && zk!=='bisagra') score -= 0.55*propias;
    if(zk==='umbral' && propias>=1) score -= 0.35*propias;
  }

  // --- Cartas especiales: su valor está en el efecto, no en el número ---
  if(val==='K'){
    if(oculta){
      // Si ya tengo un As mío oculto en esta zona, jugar la K aquí es
      // contraproducente: si revelan las dos, Eclipse anula la Coronación.
      const asPropioOculto = liveCards(g, zk).some(e=>e.card.owner===botId && !e.faceUp && e.card.value==='A');
      if(asPropioOculto){
        score -= worth + 1.5;
      } else {
        // Solo sirve si la atacan: mejor cebo donde no ganarías de otra forma
        const amenaza = rivalTokens(g, botId) > 0 ? 1 : 0.15;
        const mia = zoneWinProb(g, zk, botId);
        score += worth * (0.45 + 0.5*(1-mia)) * amenaza;
      }
    } else {
      score -= 1.4;                                // a la vista es una carta muerta
    }
  } else if(val==='A'){
    if(oculta){
      // Mismo conflicto al revés: mi propia K oculta aquí quedaría anulada.
      const kPropiaOculta = liveCards(g, zk).some(e=>e.card.owner===botId && !e.faceUp && e.card.value==='K');
      if(kPropiaOculta){
        score -= worth + 1.5;
      } else {
        const amenaza = rivalTokens(g, botId) > 0 ? 1 : 0.15;
        // Lo que niega el As es lo que un rival iba a llevarse: cuanto más
        // encarrilada tenga un rival la zona, más daño hace ponerlo ahí.
        const mia = zoneWinProb(g, zk, botId);
        const rivalCerca = 1 - mia;
        score += worth * rivalCerca * 0.9 * amenaza;
        score -= mia * worth * 0.5;                // no te sabotees a ti mismo
      }
    } else {
      score -= 1.4;
    }
  } else if(val==='Q'){
    if(oculta){
      score -= 0.9;                                // desperdiciada
    } else {
      const ocultasRivales = liveCards(g, zk).filter(e=>!e.faceUp && e.card.owner!==botId).length;
      score += ocultasRivales * 1.15;
      if(ocultasRivales===0) score -= 0.7;
    }
  } else if(val==='J'){
    if(oculta) score -= 0.5;
    else {
      const enMesa = ZONE_KEYS.reduce((n,z)=>n+liveCards(g,z).length,0);
      score += enMesa>=2 ? 0.7 : -0.5;
    }
  }

  // --- Riesgo de jugar en secreto ---
  if(oculta && !isSpecial(val)){
    const fichas = Math.min(rivalTokens(g, botId), 4);
    // Si va por detrás en Prestigio se arriesga más de buena gana; si va por
    // delante, prefiere no exponerse.
    const penal = fichas * 0.11 * cautela(g, botId);
    // Pero ese riesgo nunca debe bastar por sí solo para preferir enseñarla:
    // si taparla ya es claramente mejor que jugarla a la vista en esta misma
    // zona (por ejemplo, porque a la vista pierdes fijo y oculta aún tienes
    // opciones), el descuento no puede superar esa ventaja real.
    const wpAVista = simulaCarta(g, botId, val, zk, false, 0, ()=>zoneWinProb(g, zk, botId));
    const margen = despuesOculta===null ? penal : Math.max(0, (despuesOculta - wpAVista) * worth);
    score -= Math.min(penal, margen);
  }

  // --- Economía de mano: no malgastar los extremos ---
  if(!isSpecial(val)){
    if(zk==='cima' && base<=4) score -= 0.5;
    if(zk==='foso' && base>=7) score -= 0.5;
    if(zk==='umbral' && base>=9) score -= 0.25;
  }
  return score;
}

function rivalTokens(g, botId){
  return g.players.filter(p=>p.id!==botId).reduce((n,p)=>n+(g.tokens[p.id]||0),0);
}

/* En un juego de faroleo, jugar siempre lo mismo es explotable: si el As
   acaba siempre en la misma zona, el rival aprende a no atacar allí. Por eso
   entre las jugadas casi igual de buenas se elige una al azar. */
function eligeEntreParecidas(opciones, ruido){
  if(!opciones.length) return null;
  // Un pellizco de azar sobre cada opción: las claramente mejores siguen
  // ganando, pero entre las parecidas no siempre sale la misma.
  let mejor=null, mejorSc=-1e9;
  opciones.forEach(o=>{
    const sc = o.score + (Math.random()-0.5)*2*ruido;
    if(sc>mejorSc){ mejorSc=sc; mejor=o; }
  });
  return mejor;
}

/* Elige la mejor jugada entre todas las combinaciones posibles. */
function botChoosePlay(g, botId){
  const mano = g.hands[botId]||[];
  const opciones = [];
  mano.forEach((card, idx)=>{
    ZONE_KEYS.forEach(zk=>{
      [false, true].forEach(oculta=>{
        const sc = scorePlay(g, botId, card, zk, oculta);
        if(sc<=-90) return;
        opciones.push({idx, card, zk, oculta, score:sc});
      });
    });
  });
  return eligeEntreParecidas(opciones, 0.55);
}

/* ---------------- Ataques ---------------- */
function scoreAttack(g, botId, zk, entry){
  const flags = (g.zoneFlags && g.zoneFlags[zk]) || {};
  if(flags.eclipse) return -1;                     // zona muerta: no tiene sentido
  const worth = ZONE_WORTH[zk];
  const dueno = entry.card.owner;

  // ¿Cuánto mejora mi posición si esta carta desaparece?
  const antes = zoneWinProb(g, zk, botId);
  entry.discarded = true;
  const despues = zoneWinProb(g, zk, botId);
  entry.discarded = false;
  const ganancia = (despues - antes) * worth;

  // En la última ronda las fichas que sobren no valen nada: casi no cuestan
  const coste = g.round>=4 ? 0.03 : 0.22;
  const mias = g.tokens[botId]||0;

  if(entry.faceUp){
    if(entry.attackedOnce) return ganancia - coste;      // un golpe y cae
    if(mias>=2) return ganancia - coste*2 - 0.1;         // puede rematarla en este mismo turno
    return ganancia*0.45 - coste;                         // solo la deja señalada
  }

  // Oculta: cae de un golpe, pero puede ser una K o un As
  const pK = probEsValor(g, dueno, ['K']);
  const pA = probEsValor(g, dueno, ['A']);
  let sc = ganancia * (1 - pK - pA);
  sc -= pK * (antes*worth + worth*0.8);            // le regalaríamos la zona entera
  sc -= pA * antes * worth;                        // anularíamos lo que íbamos ganando
  sc -= coste;
  return sc;
}

function botChooseAttack(g, botId){
  if((g.tokens[botId]||0) < 1) return null;
  const candidatos = [];
  let mejor = null;
  ZONE_KEYS.forEach(zk=>{
    liveCards(g, zk).forEach(e=>{
      if(e.card.owner===botId) return;
      const sc = scoreAttack(g, botId, zk, e);
      candidatos.push({zk, entry:e, score:sc});
      if(!mejor || sc>mejor.score) mejor = {zk, entry:e, score:sc};
    });
  });
  if(!mejor) return null;
  // Las fichas no se reponen, pero guardarlas hasta el final tampoco vale nada:
  // cuanto más avanza la partida, menos exigente se pone.
  const base = g.round>=4 ? -0.04 : (g.round===3 ? 0.1 : 0.3);
  // Quien va por detrás en Prestigio ataca con menos garantías; quien va por
  // delante prefiere no arriesgar fichas ni destapar cartas rivales sin necesidad.
  const umbral = base + (cautela(g, botId)-1)*0.25;
  if(mejor.score <= umbral) return null;
  const validas = candidatos.filter(o=>o.score > umbral);
  return eligeEntreParecidas(validas, 0.3);
}

/* ---------------- Umbral: elegir +1 o -1 ---------------- */
function botUmbralChoice(g, botId, cardId){
  const entry = g.zones.umbral.find(e=>e.card.id===cardId);
  if(!entry) return 1;
  let fijo = 0;
  liveCards(g,'umbral').forEach(e=>{
    if(e.card.owner!==botId || e.card.id===cardId) return;
    fijo += finalValue('umbral', e);
  });
  const base = baseValue(entry.card.value);
  const conMas = fijo + base + 1;
  const conMenos = fijo + base - 1;
  if(conMas<=11) return 1;        // más cerca de 11 sin pasarse
  if(conMenos<=11) return -1;     // evita pasarte
  return -1;
}

/* ---------------- Intercambio de la J ---------------- */
function botChooseSwap(g, botId){
  const todas = [];
  ZONE_KEYS.forEach(zk=> liveCards(g,zk).forEach(e=> todas.push({zk, e})));
  if(todas.length<2) return null;
  const base = posicionGlobal(g, botId);
  const opciones = [];
  for(let i=0;i<todas.length;i++){
    for(let j=0;j<todas.length;j++){
      if(i===j) continue;
      const a = todas[i], b = todas[j];
      if(a.zk===b.zk) continue;                 // tiene que mover algo de verdad
      const za=g.zones[a.zk], zb=g.zones[b.zk];
      const ia=za.indexOf(a.e), ib=zb.indexOf(b.e);
      if(ia<0||ib<0) continue;
      za.splice(ia,1); zb.splice(ib,1); za.push(b.e); zb.push(a.e);
      const despues = posicionGlobal(g, botId);
      za.pop(); zb.pop(); za.splice(ia,0,a.e); zb.splice(ib,0,b.e);
      let delta = despues - base;
      // A igualdad, mejor tocar una carta rival que barajar las propias
      const tocaRival = (a.e.card.owner!==botId) || (b.e.card.owner!==botId);
      if(tocaRival) delta += 0.05;
      opciones.push({a, b, delta, score: delta});
    }
  }
  if(!opciones.length) return null;
  return eligeEntreParecidas(opciones, 0.15);
}

/* ---------------- Carta sobrante ---------------- */
function botKeepOnTop(g, botId){
  const mano = g.hands[botId]||[];
  const c = mano[mano.length-1];
  if(!c) return true;
  // Guarda arriba lo que más juego da: especiales y extremos
  if(isSpecial(c.value)) return true;
  const b = baseValue(c.value);
  return (b<=3 || b>=8);
}


/* ===== La IA actúa sobre el estado compartido ===== */
function botPlayCard(g, botId, plan){
  const mano = g.hands[botId];
  const card = mano.splice(plan.idx,1)[0];
  const faceUp = !plan.oculta;
  const entry = {card, faceUp, originalFaceDown: !faceUp, revealed: faceUp,
                 attackedOnce:false, activated:false, umbralChoice:null};
  g.zones[plan.zk].push(entry);
  g.playedThisRound[botId] = (g.playedThisRound[botId]||0)+1;
  addLog(g,'jugar','*'+nameOf(g,botId)+'* juega '+(faceUp?('*'+cardLabel(card.value)+'*'):'una carta *oculta*')+' en *'+ZONE_LABEL[plan.zk]+'*.');

  if(faceUp && specialType(card.value)==='q'){ resolveQ(g, plan.zk, entry); }
  if(faceUp && specialType(card.value)==='j'){
    if(swapPosible(g)){
      const sw = botChooseSwap(g, botId);
      if(sw){
        const za=g.zones[sw.a.zk], zb=g.zones[sw.b.zk];
        const ia=za.indexOf(sw.a.e), ib=zb.indexOf(sw.b.e);
        if(ia>-1 && ib>-1){
          const dA = describeEntry(g, sw.a.e), dB = describeEntry(g, sw.b.e);
          za.splice(ia,1); zb.splice(ib,1); za.push(sw.b.e); zb.push(sw.a.e);
          addLog(g,'cambio','*'+nameOf(g,botId)+'* usa la *J*: '+dA+' pasa de *'+ZONE_LABEL[sw.a.zk]+'* a *'+ZONE_LABEL[sw.b.zk]+'*, y '+dB+' pasa de *'+ZONE_LABEL[sw.b.zk]+'* a *'+ZONE_LABEL[sw.a.zk]+'*.');
        }
      }
    } else {
      addLog(g,'cambio','*J* jugada, pero no hay cartas en dos zonas distintas para intercambiar.');
    }
  }
  g.pendingSwap = null;
  advancePlayTurn(g);
}

/* Un único paso de la IA. Devuelve true si ha hecho algo. */
function botStep(g, botId){
  if(g.status!=='playing') return false;

  if(g.phase==='jugar'){
    if(g.pendingSwap && g.pendingSwap.by!==botId) return false;
    if(currentPlayTurnPlayer(g)!==botId) return false;
    const plan = botChoosePlay(g, botId);
    if(!plan) return false;
    botPlayCard(g, botId, plan);
    return true;
  }

  if(g.phase==='atacar'){
    if(currentAttacker(g)!==botId || g.attackPassed[botId]) return false;
    const atq = botChooseAttack(g, botId);
    if(atq){ applyAttack(g, botId, atq.zk, atq.entry); return true; }
    applyPass(g, botId, false);
    return true;
  }

  if(g.phase==='resolver' && g.pendingUmbralChoices){
    const cid = Object.keys(g.pendingUmbralChoices).find(c=>{
      if(g.pendingUmbralChoices[c]!==null) return false;
      const e = g.zones.umbral.find(x=>x.card.id===c);
      return e && e.card.owner===botId;
    });
    if(!cid) return false;
    const elec = botUmbralChoice(g, botId, cid);
    g.pendingUmbralChoices[cid] = elec;
    const entry = g.zones.umbral.find(e=>e.card.id===cid);
    if(entry){ entry.revealed=true; entry.umbralChoice=elec; }
    addLog(g,'umbral','*'+nameOf(g,botId)+'* fija un modificador en *Umbral*.');
    return true;
  }

  if(g.phase==='mantenimiento' && g.pendingMaintenance && g.pendingMaintenance[botId]===false){
    const arriba = botKeepOnTop(g, botId);
    const mano = g.hands[botId]||[];
    const card = mano.pop();
    if(card){ if(arriba) g.decks[botId].unshift(card); else g.decks[botId].push(card); }
    g.pendingMaintenance[botId] = true;
    addLog(g,'jugar','*'+nameOf(g,botId)+'* coloca su carta sobrante '+(arriba?'encima':'debajo')+' del mazo.');
    return true;
  }
  return false;
}

/* El anfitrión es quien mueve a las IAs, con una pausa para que se vea. */
let botTimer = null;
let botBusy = false;
function maybeRunBots(){
  if(botBusy || botTimer) return;
  if(!game || game.status!=='playing' || screen!=='game') return;
  if(game.hostId !== myId) return;
  const espera = waitingOn(game);
  if(!espera || !isBot(game, espera.id)) return;
  botTimer = setTimeout(async ()=>{
    botTimer = null;
    if(botBusy) return;
    botBusy = true;
    try{
      const g = await readGame(roomCodeVal);
      if(g && g.status==='playing' && g.hostId===myId){
        const e2 = waitingOn(g);
        if(e2 && isBot(g, e2.id) && botStep(g, e2.id)){
          await writeGame(g);
        }
      }
    }catch(err){ /* si falla, el siguiente sondeo lo reintenta */ }
    botBusy = false;
  }, 850);
}

/* Añadir una IA a la sala (solo el anfitrión, y solo antes de empezar). */
async function addBot(){
  const g = await readGame(roomCodeVal);
  if(!g){ errorMsg='No se pudo leer la sala.'; render(); return; }
  if(g.hostId!==myId){ errorMsg='Solo el anfitrión puede añadir jugadores automáticos.'; render(); return; }
  if(g.status!=='lobby'){ errorMsg='Solo se pueden añadir antes de empezar la partida.'; render(); return; }
  if(g.players.length>=MAX_PLAYERS){ errorMsg='La sala ya está completa.'; render(); return; }
  const usados = g.players.map(p=>p.name);
  const nombre = BOT_NAMES.find(n=>usados.indexOf(n)<0) || ('Autómata '+(g.players.length+1));
  g.players.push({id:'b'+uid(6), name:nombre, bot:true});
  addLog(g,'sala','*'+nombre+'* se suma a la sala como jugador automático.');
  await writeGame(g);
}

/* ============================= HELPERS ============================= */
function uid(n){ const c='abcdefghjkmnpqrstuvwxyz23456789'; let s=''; for(let i=0;i<n;i++) s+=c[Math.floor(Math.random()*c.length)]; return s; }
function roomCode(){ return uid(4).toUpperCase(); }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function baseValue(value){ return typeof value==='number' ? value : 5; }
function specialType(value){ return {J:'j',Q:'q',K:'k',A:'a'}[value] || null; }
function makeDeck(ownerId){ return CARD_VALUES.map(v=>({id:ownerId+'-'+v, owner:ownerId, value:v})); }
function cardLabel(value){ return String(value); }
function isSpecial(value){ return !!CARD_GLYPH[String(value)]; }
/* Contenido visual de una carta boca arriba. */
function cardFaceHTML(value){
  const g = CARD_GLYPH[String(value)];
  return (g ? '<span class="cwatermark">'+g+'</span>' : '')
       + '<span class="val">'+cardLabel(value)+'</span>';
}
/* Las especiales llevan siempre a la vista el valor con el que compiten. */
function weightBadge(value){
  return isSpecial(value) ? '<div class="cwt" title="Valor con el que compite">'+baseValue(value)+'</div>' : '';
}

/* ============================= LOCAL CLIENT STATE ============================= */
let myId = null;
let myName = '';
let roomCodeVal = null;
let screen = 'landing'; // landing | lobby | game
let game = null; // last known shared state
let pollTimer = null;
let heartbeatTimer = null;
let presenceMap = {};
let missedReads = 0;
let notice = '';
let confirmDelete = false;
let confirmLeave = false;
let autoRetryTimer = null;
let autoRetries = 0;
let showManualCopy = false;
let newRoomPublic = true;
let joinCodeDraft = '';
let rulesOpen = false;
let roomList = null;
let browsing = false;
let helpOpen = false;
let logStick = true;
let logScrollTop = 0;
let errorMsg = '';
let lastAttemptedState = null;
let ui = { mode:'idle', selectedHandCard:null, selectedZone:null, orientation:'up', jSwapPicks:[], pendingAttack:null, highlightCardId:null };

/* ============================= STORAGE ============================= */
const MAX_NAME = 16;
const MAX_PLAYERS = 4;
const PRESENCE_TTL = 30000;

function gameKey(code){ return 'game:'+code; }
function presenceKey(code){ return 'presence:'+code; }

async function readGame(code){
  try{
    const res = await window.storage.get(gameKey(code), true);
    return res ? JSON.parse(res.value) : null;
  }catch(e){ return null; }
}
async function writeGame(state, attempt){
  attempt = attempt || 0;
  state.updatedAt = Date.now();
  lastAttemptedState = state;
  try{
    await window.storage.set(gameKey(state.roomCode), JSON.stringify(state), true);
    game = state;
    errorMsg='';
    maybeRunBots();
    if(autoRetryTimer){ clearTimeout(autoRetryTimer); autoRetryTimer=null; }
    autoRetries = 0;
    render();
    return true;
  }catch(e){
    const delays = [300, 700, 1500, 3000];
    if(attempt < delays.length){
      await new Promise(r=>setTimeout(r, delays[attempt]));
      return writeGame(state, attempt+1);
    }
    // Sigue fallando: reintentamos solos en segundo plano antes de molestar al jugador.
    if(autoRetries < 3){
      autoRetries++;
      errorMsg = 'La conexión con el almacenamiento está fallando. Reintentando guardar automáticamente ('+autoRetries+'/3)…';
      render();
      if(autoRetryTimer) clearTimeout(autoRetryTimer);
      autoRetryTimer = setTimeout(()=>{ writeGame(lastAttemptedState); }, 2500);
      return false;
    }
    errorMsg = 'No se pudo guardar tras varios intentos. Tu jugada está guardada en memoria: pulsa "Reintentar guardado" y se enviará tal cual.';
    render();
    return false;
  }
}
async function retryLastWrite(){
  if(!lastAttemptedState) return;
  autoRetries = 0;
  errorMsg='';
  render();
  await writeGame(lastAttemptedState);
}
function storageAvailable(){ return typeof window!=='undefined' && !!window.storage && typeof window.storage.get==='function'; }

async function rememberSession(){
  try{ await window.storage.set('mysession', JSON.stringify({roomCodeVal, myId, myName}), false); }catch(e){}
}
async function clearSession(){
  try{ await window.storage.delete('mysession', false); }catch(e){}
}
async function loadSession(){
  try{
    const res = await window.storage.get('mysession', false);
    if(res){
      const d = JSON.parse(res.value);
      if(d.roomCodeVal && d.myId){
        const g = await readGame(d.roomCodeVal);
        if(g && g.players.some(p=>p.id===d.myId) && g.status!=='closed' && g.status!=='abandoned'){
          myId=d.myId; myName=d.myName; roomCodeVal=d.roomCodeVal;
          game=g; screen = g.status==='lobby' ? 'lobby' : 'game';
          const yo = g.players.find(p=>p.id===myId);
          if(yo && yo.away){
            yo.away = false; delete yo.awaySince;
            addLog(g,'sala','*'+yo.name+'* ha vuelto a la partida.');
            writeGame(g);
          }
          startPolling(); startHeartbeat();
        } else {
          // la sala ya no existe o ya no estoy en ella: no arrastramos una sesión zombi
          myName = d.myName || '';
          await clearSession();
        }
      }
    }
  }catch(e){}
  render();
}

/* ============================= PRESENCIA ============================= */
async function heartbeat(){
  if(!roomCodeVal || !myId || !storageAvailable()) return;
  // El indicador de conexión solo se muestra en la sala de espera. Durante la
  // partida no escribimos presencia, para no saturar el almacenamiento.
  if(screen!=='lobby') return;
  try{
    let map = {};
    try{
      const res = await window.storage.get(presenceKey(roomCodeVal), true);
      if(res) map = JSON.parse(res.value) || {};
    }catch(e){ map = {}; }
    const now = Date.now();
    map[myId] = now;
    Object.keys(map).forEach(k=>{ if(now - map[k] > 300000) delete map[k]; });
    await window.storage.set(presenceKey(roomCodeVal), JSON.stringify(map), true);
    presenceMap = map;
    render();
  }catch(e){ /* la presencia es informativa: si falla, no molestamos al usuario */ }
}
function startHeartbeat(){
  if(heartbeatTimer) clearInterval(heartbeatTimer);
  heartbeat();
  heartbeatTimer = setInterval(heartbeat, 15000);
}
function stopHeartbeat(){
  if(heartbeatTimer) clearInterval(heartbeatTimer);
  heartbeatTimer = null;
  presenceMap = {};
}
function isOnline(pid){
  if(pid===myId) return true;
  if(game && isBot(game, pid)) return true;
  const t = presenceMap[pid];
  return !!t && (Date.now() - t) < PRESENCE_TTL;
}

function stopPolling(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = null;
}
function startPolling(){
  stopPolling();
  pollTimer = setInterval(async ()=>{
    if(!roomCodeVal) return;
    const g = await readGame(roomCodeVal);
    if(g){
      missedReads = 0;
      if(handleRoomEnded(g)) return;
      // Una lectura más antigua que nuestro propio estado revertiría en pantalla
      // lo que el jugador acaba de hacer, obligándole a pulsar dos veces.
      if(game && game.updatedAt && g.updatedAt && g.updatedAt < game.updatedAt){ return; }
      game=g;
      if(screen==='lobby' && g.status==='playing') screen='game';
      if(screen==='game' && g.status==='lobby') screen='lobby'; // revancha: todos vuelven al lobby
      render();
      maybeRunBots();
    } else {
      // No distinguimos "borrada" de "fallo puntual de lectura", así que no
      // expulsamos al jugador: avisamos y que decida él.
      missedReads++;
      render();
    }
  }, 2200);
}

/* Detecta que la sala terminó para mí (cerrada, abandonada o me han sacado). */
function handleRoomEnded(g){
  if(g.status==='closed'){
    goToNotice('El anfitrión ha eliminado la sala.');
    return true;
  }
  if(g.status==='abandoned'){
    goToNotice((g.abandonedBy||'Un jugador')+' ha abandonado, así que la partida ha terminado.');
    return true;
  }
  if(!g.players.some(p=>p.id===myId)){
    const rec = (g.removedPlayers||[]).find(r=>r.id===myId);
    goToNotice(rec && rec.reason==='kicked'
      ? 'El anfitrión te ha expulsado de la sala.'
      : 'Ya no estás en esta sala.');
    return true;
  }
  return false;
}

function goToNotice(text){
  stopPolling(); stopHeartbeat();
  notice = text;
  screen = 'notice';
  game = null; roomCodeVal = null; myId = null;
  missedReads = 0;
  clearSession();
  render();
}
function backToLanding(){
  notice=''; errorMsg=''; missedReads=0;
  screen='landing';
  render();
}

/* ============================= ROOM ACTIONS ============================= */
function validateName(){
  const name = (myName||'').trim();
  if(!name) return {ok:false, msg:'Escribe tu nombre.'};
  if(name.length>MAX_NAME) return {ok:false, msg:'El nombre no puede pasar de '+MAX_NAME+' caracteres.'};
  return {ok:true, name};
}

async function freshRoomCode(){
  for(let i=0;i<6;i++){
    const code = roomCode();
    const existing = await readGame(code);
    if(!existing) return code;
  }
  return null;
}

async function createRoom(){
  if(!storageAvailable()){ errorMsg='Esta app necesita ejecutarse como artifact dentro de Claude (no como archivo descargado) para poder crear salas online.'; render(); return; }
  const v = validateName();
  if(!v.ok){ errorMsg=v.msg; render(); return; }

  const code = await freshRoomCode();
  if(!code){ errorMsg='No se pudo generar un código libre. Vuelve a intentarlo.'; render(); return; }

  myId = 'p'+uid(6);
  roomCodeVal = code;
  const state = {
    roomCode: code, status:'lobby', hostId: myId, isPublic: !!newRoomPublic,
    players: [{id:myId, name:v.name}],
    removedPlayers: [],
    log: ['Sala creada por '+v.name+'.']
  };
  const ok = await writeGame(state);
  if(!ok){ roomCodeVal=null; myId=null; return; }
  myName = v.name;
  await rememberSession();
  screen='lobby'; startPolling(); startHeartbeat(); render();
}

async function joinRoom(codeInput){
  if(!storageAvailable()){ errorMsg='Esta app necesita ejecutarse como artifact dentro de Claude (no como archivo descargado) para poder unirse a salas online.'; render(); return; }
  const v = validateName();
  if(!v.ok){ errorMsg=v.msg; render(); return; }
  const code = (codeInput||'').trim().toUpperCase();
  if(!code){ errorMsg='Escribe el código de la sala.'; render(); return; }

  const candidateId = 'p'+uid(6);

  // Varios jugadores pueden entrar a la vez y pisarse (el almacenamiento es
  // "gana el último"), así que escribimos, verificamos que seguimos dentro y,
  // si no, reintentamos con el estado más reciente.
  for(let attempt=0; attempt<4; attempt++){
    const g = await readGame(code);
    if(!g){ errorMsg='No existe esa sala.'; render(); return; }
    if(g.status==='closed' || g.status==='abandoned'){ errorMsg='Esa sala ya se ha cerrado.'; render(); return; }

    // Reconexión: si la partida está en curso y ya existe un jugador con ese
    // nombre, recuperamos su sitio en vez de crear uno nuevo.
    if(g.status==='playing' || g.status==='ended'){
      const asiento = g.players.find(p=>p.name.toLowerCase()===v.name.toLowerCase());
      if(!asiento){ errorMsg='Esa partida ya ha empezado y no hay ningún jugador con ese nombre.'; render(); return; }
      asiento.away = false;
      delete asiento.awaySince;
      addLog(g,'sala','*'+asiento.name+'* ha vuelto a la partida.');
      roomCodeVal = code; myId = asiento.id; myName = asiento.name;
      const vuelto = await writeGame(g);
      if(!vuelto){ roomCodeVal=null; myId=null; return; }
      await rememberSession();
      screen='game'; startPolling(); startHeartbeat(); render();
      return;
    }

    if(g.players.length>=MAX_PLAYERS){ errorMsg='La sala ya tiene '+MAX_PLAYERS+' jugadores.'; render(); return; }
    if(g.players.some(p=>p.name.toLowerCase()===v.name.toLowerCase())){
      errorMsg='Ya hay alguien con ese nombre en la sala. Elige otro.'; render(); return;
    }

    g.players.push({id:candidateId, name:v.name});
    addLog(g,'sala','*'+v.name+'* se ha unido a la sala.');

    roomCodeVal = code; myId = candidateId;
    const ok = await writeGame(g);
    if(!ok){ roomCodeVal=null; myId=null; return; }

    await new Promise(r=>setTimeout(r, 250));
    const check = await readGame(code);
    if(check && check.players.some(p=>p.id===candidateId)){
      game = check;
      myName = v.name;
      await rememberSession();
      screen='lobby'; startPolling(); startHeartbeat(); render();
      return;
    }
  }
  roomCodeVal=null; myId=null; game=null;
  errorMsg='No se pudo entrar: varios jugadores estaban entrando a la vez. Prueba otra vez.';
  render();
}

/* Salir de la sala por decisión propia. En el lobby simplemente te quitas;
   en partida se termina para todos, porque el motor no puede continuar sin
   uno de los jugadores (sus cartas y turnos están en juego). */
async function leaveRoom(){
  const code = roomCodeVal;
  if(!code) { backToLanding(); return; }
  const g = await readGame(code);
  if(!g){ goToNotice('Has salido de la sala.'); return; }

  if(g.status==='playing'){
    // No cerramos la partida: marcamos al jugador como ausente para que pueda
    // volver con el mismo código y su mismo nombre.
    const yo = g.players.find(p=>p.id===myId);
    if(yo){ yo.away = true; yo.awaySince = Date.now(); }
    addLog(g,'sala','*'+myName+'* se ha desconectado. Puede volver con el código de la sala.');
    if(g.players.every(p=>p.away)){
      g.status='closed';
      addLog(g,'sala','No queda nadie en la partida: la sala se cierra.');
      await writeGame(g);
      goToNotice('Has salido y no quedaba nadie más, así que la sala se ha cerrado.');
      return;
    }
    await writeGame(g);
    goToNotice('Has salido de la partida. Puedes volver entrando con el código '+code+' y el mismo nombre.');
    return;
  }

  const wasHost = g.hostId===myId;
  g.players = g.players.filter(p=>p.id!==myId);
  g.removedPlayers = (g.removedPlayers||[]).concat([{id:myId, name:myName, reason:'left', at:Date.now()}]);
  addLog(g,'sala','*'+myName+'* ha salido de la sala.');

  if(g.players.length===0){
    // Nadie queda: borramos la sala en vez de dejar basura en el almacenamiento.
    try{ await window.storage.delete(gameKey(code), true); }catch(e){}
    try{ await window.storage.delete(presenceKey(code), true); }catch(e){}
    goToNotice('Has salido y la sala se ha eliminado (no quedaba nadie).');
    return;
  }
  if(wasHost){
    g.hostId = g.players[0].id;
    addLog(g,'sala','*'+g.players[0].name+'* pasa a ser el anfitrión.');
  }
  await writeGame(g);
  goToNotice('Has salido de la sala.');
}

/* El anfitrión expulsa a alguien (solo en el lobby: a mitad de partida
   quitar a un jugador dejaría sus cartas y turnos en un estado inconsistente). */
async function kickPlayer(targetId){
  const g = await readGame(roomCodeVal);
  if(!g) return;
  if(g.hostId!==myId){ errorMsg='Solo el anfitrión puede expulsar jugadores.'; render(); return; }
  if(g.status!=='lobby'){ errorMsg='Solo puedes expulsar jugadores antes de empezar la partida.'; render(); return; }
  if(targetId===myId){ errorMsg='No puedes expulsarte a ti mismo. Usa "Salir de la sala".'; render(); return; }
  const target = g.players.find(p=>p.id===targetId);
  if(!target) return;
  g.players = g.players.filter(p=>p.id!==targetId);
  g.removedPlayers = (g.removedPlayers||[]).concat([{id:targetId, name:target.name, reason:'kicked', at:Date.now()}]);
  addLog(g,'sala','*'+target.name+'* ha sido expulsado por el anfitrión.');
  await writeGame(g);
}

/* El anfitrión cierra la sala para todos. Marcamos 'closed' primero para que
   el resto lo vea al sondear, y borramos la clave poco después. */
async function closeRoom(){
  const code = roomCodeVal;
  const g = await readGame(code);
  if(!g) { goToNotice('La sala ya no existe.'); return; }
  if(g.hostId!==myId){ errorMsg='Solo el anfitrión puede eliminar la sala.'; render(); return; }
  g.status='closed';
  g.closedAt = Date.now();
  addLog(g,'sala','*'+myName+'* ha eliminado la sala.');
  await writeGame(g);
  setTimeout(async ()=>{
    try{ await window.storage.delete(gameKey(code), true); }catch(e){}
    try{ await window.storage.delete(presenceKey(code), true); }catch(e){}
  }, 5000);
  goToNotice('Has eliminado la sala.');
}

/* Vuelve al lobby con los mismos jugadores para jugar otra partida. */
async function rematch(){
  const fresh = await readGame(roomCodeVal);
  if(!fresh){ errorMsg='No se pudo leer la sala.'; render(); return; }
  if(fresh.hostId!==myId){ errorMsg='Solo el anfitrión puede empezar otra partida.'; render(); return; }
  const g = {
    roomCode: fresh.roomCode, status:'lobby', hostId: fresh.hostId, isPublic: !!fresh.isPublic,
    players: fresh.players, removedPlayers: fresh.removedPlayers||[],
    log: ['Nueva partida: volvéis a la sala de espera.']
  };
  ui = {mode:'idle', selectedHandCard:null, selectedZone:null, orientation:'up', jSwapPicks:[], pendingAttack:null, highlightCardId:null};
  screen='lobby';
  await writeGame(g);
}

async function startGame(){
  // Releemos por si alguien acaba de entrar o salir mientras mirábamos el lobby.
  const fresh = await readGame(roomCodeVal);
  if(!fresh){ errorMsg='No se pudo leer la sala. Inténtalo otra vez.'; render(); return; }
  const g = fresh;
  confirmDelete=false; confirmLeave=false;
  if(g.hostId!==myId){ errorMsg='Solo el anfitrión puede empezar la partida.'; render(); return; }
  if(g.status!=='lobby') return;
  if(g.players.length<2 || g.players.length>MAX_PLAYERS){
    errorMsg='Hacen falta entre 2 y '+MAX_PLAYERS+' jugadores para empezar.'; render(); return;
  }
  const order = shuffle(g.players.map(p=>p.id));
  g.status='playing';
  g.startedAt=Date.now();
  g.round=1;
  g.phase='jugar';
  g.turnOrder=order;
  g.decks={}; g.hands={}; g.discard={}; g.tokens={}; g.prestige={};
  g.playedThisRound={}; g.spentThisRound={};
  g.players.forEach(p=>{
    g.decks[p.id]=shuffle(makeDeck(p.id));
    g.discard[p.id]=[];
    g.tokens[p.id]=3;
    g.prestige[p.id]=0;
    g.spentThisRound[p.id]=0;
  });
  g.zones={bisagra:[],umbral:[],cima:[],foso:[]};
  g.bisagraAdvantage=null;
  g.zoneFlags={};
  g.pendingSwap=null;
  g.resolvedZones={};
  g.roundResults=[];
  g.pendingUmbralChoices=null;
  g.pendingMaintenance=null;
  g.resolveStep=0;
  g.winner=null;
  drawForRound(g);
  g.playTurnIndex=0;
  g.attackTurnIndex=0;
  g.attackPassed={};
  addLog(g,'ronda','*Ronda 1.* Orden: '+order.map(id=>nameOf(g,id)).join(' → ')+'.');
  await writeGame(g);
}

function drawForRound(g){
  const n = g.round===4 ? 3 : 4;
  g.players.forEach(p=>{
    g.hands = g.hands || {};
    const drawn = g.decks[p.id].splice(0, n);
    g.hands[p.id] = drawn;
  });
  g.playedThisRound = {};
  g.players.forEach(p=> g.playedThisRound[p.id]=0);
}

function nameOf(g,id){ const p=g.players.find(pp=>pp.id===id); return p?p.name:'?'; }

/* ============================= JUGAR PHASE ============================= */
function quotaThisRound(g){ return g.round===4 ? 3 : 3; }

async function playCard(cardIndex, zoneKey, faceUp){
  const g = game;
  if(g.phase!=='jugar') return;
  const currentId = currentPlayTurnPlayer(g);
  if(currentId!==myId) return;
  const hand = g.hands[myId];
  const card = hand[cardIndex];
  if(!card) return;
  if(zoneKey==='bisagra' && liveCards(g,'bisagra').length>=2){ errorMsg='Bisagra ya está llena.'; render(); return; }
  hand.splice(cardIndex,1);
  const entry = {card, faceUp: !!faceUp, originalFaceDown: !faceUp, revealed: !!faceUp, attackedOnce:false, activated:false, umbralChoice:null};
  g.zones[zoneKey].push(entry);
  g.playedThisRound[myId] = (g.playedThisRound[myId]||0)+1;
  addLog(g,'jugar','*'+myName+'* juega '+(faceUp?('*'+cardLabel(card.value)+'*'):'una carta *oculta*')+' en *'+ZONE_LABEL[zoneKey]+'*.');

  let pendingSwap = false;
  if(faceUp && specialType(card.value)==='j'){
    if(swapPosible(g)){
      pendingSwap = true;
    } else {
      addLog(g,'cambio','*J* jugada, pero no hay cartas en dos zonas distintas para intercambiar.');
    }
  }
  if(faceUp && specialType(card.value)==='q'){
    resolveQ(g, zoneKey, entry);
  }

  if(pendingSwap){
    // Vive en el estado compartido, no solo en este navegador: así sobrevive a
    // una recarga y los demás saben a qué se está esperando.
    g.pendingSwap = {by: myId, cardId: card.id};
    ui.jSwapPicks=[];
    await writeGame(g);
    return;
  }
  g.pendingSwap = null;

  advancePlayTurn(g);
  ui = {mode:'idle', selectedHandCard:null, selectedZone:null, orientation:'up', jSwapPicks:[], pendingAttack:null, highlightCardId:null};
  await writeGame(g);
}

/* Describe una carta de la mesa sin revelar información oculta. */
function describeEntry(g, entry){
  const owner = nameOf(g, entry.card.owner);
  return entry.faceUp
    ? ('el '+cardLabel(entry.card.value)+' de '+owner)
    : ('una carta oculta de '+owner);
}

/* ¿Estoy yo con un intercambio de J pendiente? Se lee del estado compartido. */
/* La J solo puede intercambiar si hay cartas en al menos dos zonas distintas. */
function swapPosible(g){
  return ZONE_KEYS.filter(zk=>liveCards(g,zk).length>0).length >= 2;
}
function swapMode(){
  return !!(game && game.pendingSwap && game.pendingSwap.by===myId);
}
function liveCards(g, zoneKey){ return g.zones[zoneKey].filter(e=>!e.discarded); }

/* ¿Estoy yo con un intercambio de J pendiente? Se lee del estado compartido. */
function swapMode(){
  return !!(game && game.pendingSwap && game.pendingSwap.by===myId);
}
function liveCards(g, zoneKey){ return g.zones[zoneKey].filter(e=>!e.discarded); }

function markZoneFlag(g, zoneKey, entry){
  g.zoneFlags = g.zoneFlags || {};
  const f = g.zoneFlags[zoneKey] = g.zoneFlags[zoneKey] || {};
  if(entry.card.value==='A'){
    f.eclipse = true;
    f.eclipseBy = (f.eclipseBy||[]).concat([entry.card.owner]);
  }
  if(entry.card.value==='K') f.coronation = (f.coronation||[]).concat([entry.card.owner]);
}

function resolveQ(g, zoneKey, qEntry){
  const zone = g.zones[zoneKey];
  const targets = zone.filter(e=>e!==qEntry && e.faceUp===false);
  targets.forEach(e=>{
    if(specialType(e.card.value)==='k' || specialType(e.card.value)==='a'){
      e.revealed=true; e.faceUp=true; e.activated=true;
      markZoneFlag(g, zoneKey, e);
      e.revealedBy = 'Q';
      addLog(g,'activar','La *Q* ataca una oculta de *'+nameOf(g,e.card.owner)+'* en *'+ZONE_LABEL[zoneKey]+'*: era un *'+cardLabel(e.card.value)+'* y se activa.');
    } else {
      addLog(g,'purga','La *Q* derriba una carta oculta de *'+nameOf(g,e.card.owner)+'* en *'+ZONE_LABEL[zoneKey]+'*: era un *'+cardLabel(e.card.value)+'*.');
      e.faceUp = true;
      e.revealed = true;
      e.discarded = true;
      e.discardedBy = 'Q';
    }
  });
}

function allZoneCardRefs(g){
  const out=[];
  ZONE_KEYS.forEach(zk=> g.zones[zk].forEach(e=> out.push({zone:zk, entry:e})));
  return out;
}

async function pickJSwapTarget(zoneKey, entry){
  if(!swapMode()) return;
  const cardId = entry.card.id;
  const already = ui.jSwapPicks.find(p=>p.cardId===cardId);
  if(already){ ui.jSwapPicks = ui.jSwapPicks.filter(p=>p!==already); render(); return; }
  ui.jSwapPicks.push({zone:zoneKey, cardId});
  if(ui.jSwapPicks.length===2){
    const [a,b] = ui.jSwapPicks;
    const g = game;
    // resolvemos siempre contra el estado más reciente por si ha pasado tiempo entre los dos clics
    const liveA = findLiveEntry(g, a.zone, a.cardId);
    const liveB = findLiveEntry(g, b.zone, b.cardId);
    if(!liveA || !liveB){
      addLog(g,'cambio','*'+myName+'* intentó usar la *J*, pero una de las cartas elegidas ya no está en la mesa.');
    } else if(a.zone===b.zone){
      // El intercambio tiene que mover algo: si es la misma zona, no cuenta
      ui.jSwapPicks = [a];
      errorMsg = 'Las dos cartas tienen que estar en zonas distintas. Elige otra.';
      render();
      return;
    } else {
      const zoneA = g.zones[a.zone], zoneB = g.zones[b.zone];
      const idxA = zoneA.indexOf(liveA), idxB = zoneB.indexOf(liveB);
      if(idxA>-1 && idxB>-1){
        const descA = describeEntry(g, liveA);
        const descB = describeEntry(g, liveB);
        zoneA.splice(idxA,1);
        zoneB.splice(idxB,1);
        zoneA.push(liveB);
        zoneB.push(liveA);
        const txt = '*'+myName+'* usa la *J*: '+descA+' pasa de *'+ZONE_LABEL[a.zone]+'* a *'+ZONE_LABEL[b.zone]
                  +'*, y '+descB+' pasa de *'+ZONE_LABEL[b.zone]+'* a *'+ZONE_LABEL[a.zone]+'*.';
        addLog(g,'cambio',txt);
      }
    }
    ui.jSwapPicks=[];
    g.pendingSwap = null;
    advancePlayTurn(g);
    await writeGame(g);
  } else {
    render();
  }
}
/* Solo se usa cuando ya no queda intercambio posible sobre la mesa. */
function cancelJSwap(){
  const g = game;
  ui.jSwapPicks=[];
  g.pendingSwap = null;
  addLog(g,'cambio','No quedan cartas en dos zonas distintas: la *J* se queda donde está.');
  advancePlayTurn(g);
  writeGame(g);
}
/* Otro jugador salta el intercambio de quien no responde. */
async function skipSwapFor(playerId){
  const g = await readGame(roomCodeVal);
  if(!g || !g.pendingSwap || g.pendingSwap.by!==playerId) return;
  if(secondsStalled(g) < STALL_SECONDS){ errorMsg='La partida ha vuelto a moverse.'; render(); return; }
  g.pendingSwap = null;
  addLog(g,'cambio','Se salta el intercambio de la *J* de *'+nameOf(g,playerId)+'*: llevaba demasiado tiempo sin responder.');
  advancePlayTurn(g);
  await writeGame(g);
}

function currentPlayTurnPlayer(g){
  const order = g.turnOrder;
  let idx = g.playTurnIndex % order.length;
  return order[idx];
}
function advancePlayTurn(g){
  const quota = quotaThisRound(g);
  const order = g.turnOrder;
  let tries=0;
  do{
    g.playTurnIndex = (g.playTurnIndex+1) % order.length;
    tries++;
  } while(g.playedThisRound[order[g.playTurnIndex]]>=quota && tries<=order.length);
  const allDone = order.every(id => g.playedThisRound[id]>=quota);
  if(allDone){
    g.phase='atacar';
    g.attackTurnIndex=0;
    g.turnAttacks=0;
    g.attackPassed={};
    order.forEach(id=>g.attackPassed[id]=false);
    addLog(g,'ronda','*Fase de ataque.*');
  }
}

/* ============================= ATACAR PHASE ============================= */
function currentAttacker(g){
  const order=g.turnOrder;
  let idx = g.attackTurnIndex % order.length;
  return order[idx];
}
function findLiveEntry(g, zoneKey, cardId){
  return g.zones[zoneKey].find(e=>e.card.id===cardId);
}
function requestAttack(zoneKey, entry){
  ui.pendingAttack = {zone:zoneKey, cardId:entry.card.id};
  render();
}
function cancelAttack(){
  ui.pendingAttack = null;
  render();
}
async function confirmAttack(){
  if(!ui.pendingAttack) return;
  const {zone, cardId} = ui.pendingAttack;
  ui.pendingAttack = null;
  const liveEntry = findLiveEntry(game, zone, cardId);
  if(!liveEntry){ render(); return; } // la carta ya no está ahí (otro jugador actuó primero)
  await attackTarget(zone, liveEntry);
}
function applyAttack(g, attackerId, zoneKey, entry){
  const nombre = nameOf(g, attackerId);
  g.tokens[attackerId]-=1;
  g.spentThisRound[attackerId] = (g.spentThisRound[attackerId]||0)+1;
  g.turnAttacks = (g.turnAttacks||0)+1;
  if(entry.faceUp===false){
    entry.revealed=true;
    const t = specialType(entry.card.value);
    if(t==='k' || t==='a'){
      entry.faceUp=true; entry.activated=true;
      markZoneFlag(g, zoneKey, entry);
      entry.revealedBy = nombre;
      const habilidad = t==='a'
        ? ZONE_LABEL[zoneKey]+' *queda inhabilitada*'
        : '*'+nameOf(g,entry.card.owner)+'* se lleva '+ZONE_LABEL[zoneKey];
      addLog(g,'activar','*'+nombre+'* ataca una oculta de *'+nameOf(g,entry.card.owner)+'* en *'+ZONE_LABEL[zoneKey]+'*: era un *'+cardLabel(entry.card.value)+'*. '+habilidad+'.');
    } else {
